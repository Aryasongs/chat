<style>
:root{
  --bg:#E6EEFA; --card:#fff; --navy:#2D2A5E; --ink:#3A3860; --muted:#8C90A8; --soft:#F3F4FC;
  --blue:#3B82F6; --blue-d:#2F6FE0; --line:#EDEFF7; --danger:#E5484D;
  --head:'Poppins','Inter',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1424;--card:#171D30;--navy:#ECEEFB;--ink:#D8DBF0;--muted:#8A90AD;--soft:#222a42;--line:#262E48}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px}
.phone{width:min(475px,100%);height:min(990px,calc(100vh - 64px));background:var(--card);border-radius:56px;box-shadow:0 30px 70px rgba(70,100,170,.10);position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ---------- left: list card ---------- */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 32px}
.panel-top{display:flex;align-items:center;justify-content:space-between;padding-top:82px;margin-bottom:18px}
.panel-top h1{font:600 40px/1.1 var(--head);color:var(--navy);margin:0;letter-spacing:-.3px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.icon-btn:hover{background:var(--soft)}
.searchbar{margin:0 0 6px;display:none}
.searchbar.on{display:block}
.searchbar input{width:100%;height:44px;border:0;border-radius:22px;background:var(--soft);padding:0 18px;outline:none}
.scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -32px;padding:0 32px 90px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;cursor:pointer;width:100%;text-align:left}
.row .body{flex:1;min-width:0}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row .name{font:500 18px/1.3 var(--head);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:15px;color:var(--muted);white-space:nowrap}
.row .prev{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px}
.row .txt{color:var(--muted);font-size:16px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.badge{min-width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;font:600 15px/32px var(--body);text-align:center;padding:0 8px;flex:none}
.row.active .name{color:var(--blue)}
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 20px var(--head);aspect-ratio:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%;display:block}
.av img.flag{position:absolute;inset:auto;right:-4%;top:-4%;width:32%;height:auto;max-width:22px;min-width:13px;aspect-ratio:1;border-radius:50%;object-fit:cover;border:2px solid var(--card);background:#fff;z-index:2}
.rcpt .av .flag{display:none}
.av .dot{position:absolute;right:1%;bottom:1%;width:22%;max-width:20px;min-width:12px;aspect-ratio:1;border-radius:50%;background:var(--blue);border:3px solid var(--card)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.6;font-size:15px}
.empty b{display:block;color:var(--navy);font:600 18px var(--head);margin-bottom:6px}

.fab{position:absolute;right:30px;bottom:132px;width:80px;height:80px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(59,130,246,.45);z-index:3;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:34px;height:34px;stroke-width:1.6}

.nav{height:112px;flex:none;display:flex;justify-content:space-around;align-items:center;padding:0 38px 6px;background:var(--card)}
.nav button{position:relative;width:48px;height:48px;display:grid;place-items:center;color:#9CA0B8}
.nav button.on{color:var(--navy)}
.nav button.on::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--navy)}
.nav svg{width:30px;height:30px}

/* settings / contacts */
.spage{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;overscroll-behavior:contain;animation:moin .16s ease-out}
.sph{display:flex;align-items:center;gap:6px;padding:14px 12px;position:sticky;top:0;background:var(--bg);z-index:1}
.sph .icon-btn{color:var(--navy)}
.sph h2{font:600 22px var(--head);color:var(--navy);margin:0}
.spb{padding:6px 20px 40px;max-width:640px;margin:0 auto}
.soon{font:600 11px var(--head);background:var(--soft);color:var(--muted);padding:4px 10px;border-radius:20px;white-space:nowrap}
.item .chev{width:18px;height:18px;flex:none}
.acen{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:22px;padding:14px 14px 14px 16px;margin:26px 0 0;color:var(--navy);text-decoration:none;box-shadow:0 2px 14px rgba(45,42,94,.07);border:1px solid var(--line)}
.acen .ic{width:44px;height:44px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.acen .ic svg{width:24px;height:24px;color:var(--card);stroke-width:2.2}
.acen .t{flex:1;min-width:0}
.acen .t b{display:block;font:600 15.5px var(--head);color:var(--navy);margin-bottom:2px}
.acen .t span{display:block;font:400 13px/1.4 var(--body);color:var(--muted)}
.acen>svg.cv{width:18px;height:18px;flex:none;color:var(--muted)}
.also{background:var(--card);border-radius:22px;padding:18px 10px 16px;margin:14px 0 8px;box-shadow:0 2px 14px rgba(45,42,94,.07);border:1px solid var(--line)}
.also h3{font:600 13px var(--head);color:var(--muted);margin:0 0 16px 8px;text-transform:uppercase;letter-spacing:.8px}
.also .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.also a{display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--navy);font:500 13.5px var(--head);text-decoration:none;min-width:0;text-align:center}
.also a img{width:56px;height:56px;border-radius:50%;object-fit:cover;box-shadow:0 4px 12px rgba(45,42,94,.22);transition:transform .15s}
.also a:active img{transform:scale(.92)}
.also a span{white-space:nowrap}
.m.vo .bub{background:transparent!important;box-shadow:none!important;padding:0!important;border:0!important}
.vob{display:flex;align-items:center;gap:12px;padding:11px 18px 11px 14px;border-radius:22px;border:1.5px solid var(--blue);background:var(--card);color:var(--blue);text-align:left;min-width:200px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.m.them .vob:not(.done){background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(220,39,67,.35)}
.m.them .vob:not(.done):active{transform:scale(.96)}
.m.me .vob:not(.done):not(.ss){border-color:transparent;color:#dc2743;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(45deg,#f09433,#dc2743,#bc1888) border-box}
.vob.done{border-style:dashed;border-color:var(--muted)!important;color:var(--muted)!important;background:transparent!important;box-shadow:none!important}
.m.me .vob.ss{border-style:solid;border-color:var(--danger)!important;color:var(--danger)!important;background:var(--card)!important}
.vob svg{width:26px;height:26px;flex:none}
.vob .vot2{display:flex;flex-direction:column;gap:1px}
.vob b{font:600 14.5px var(--head)}
.vob .vos{font:400 12px var(--body);opacity:.85}
#voview{position:fixed;inset:0;z-index:120;background:#000;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;animation:moin .15s ease-out}
#voview .vostage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#voview canvas,#voview img{max-width:100%;max-height:100%;pointer-events:none;-webkit-user-drag:none}
#voview canvas.vocv{filter:brightness(var(--vogain,1.35))}
#voview .vowm{position:absolute;inset:-130px;pointer-events:none;background-repeat:repeat;animation:vowm 14s linear infinite}
@keyframes vowm{to{background-position:220px 120px}}
#voview .vop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
#voview .vobar{display:block;height:100%;width:0;background:#fff}
#voview.on .vobar{animation:vobar var(--vomax,15s) linear forwards}
@keyframes vobar{to{width:100%}}
#voview .vot{position:absolute;top:calc(env(safe-area-inset-top,0px) + 24px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;color:#fff;background:rgba(255,255,255,.16);padding:8px 16px;border-radius:20px;font:500 13px var(--head);backdrop-filter:blur(8px);white-space:nowrap}
#voview .vot svg{width:18px;height:18px}
#voview .voload,#voview .voh{position:absolute;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font:500 13px var(--body);white-space:nowrap}
#voview .voload{top:50%;transform:translate(-50%,-50%)}
#voview .voh{bottom:calc(env(safe-area-inset-bottom,0px) + 28px);font-size:12.5px;opacity:.8}
#voview.on .voload{display:none}
@media print{#voview{display:none!important}}
.vosh{position:fixed;inset:0;z-index:110;background:rgba(10,12,24,.55);display:flex;align-items:flex-end;justify-content:center;animation:moin .15s ease-out}
.vosh .box{width:100%;max-width:480px;background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.vosh .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.vosh .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.vosh .hd img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.vosh .hd b{display:block;font:600 16px var(--head);color:var(--navy)}
.vosh .hd span{font:400 12.5px var(--body);color:var(--muted)}
.vosh .opt{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;margin-top:10px;border:1.5px solid var(--line);border-radius:16px;background:transparent;color:var(--ink);text-align:left}
.vosh .opt.sel{border-color:#dc2743;box-shadow:0 0 0 3px rgba(220,39,67,.12)}
.vosh .opt svg{width:26px;height:26px;flex:none;color:#dc2743}
.vosh .opt b{display:block;font:600 14.5px var(--head)}
.vosh .opt span{font:400 12.5px var(--body);color:var(--muted)}
.vosh .nt{font:400 12px/1.5 var(--body);color:var(--muted);margin:12px 2px 0}
.vosh .go{margin-top:14px;width:100%;height:46px;border:0;border-radius:23px;color:#fff;font:600 15px var(--head);background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
.vosh .cx{margin-top:6px;width:100%;height:40px;border:0;background:transparent;color:var(--muted);font:500 14px var(--head)}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -32px;padding:0 32px 12px;scrollbar-width:none;flex:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:34px;padding:0 16px;border-radius:17px;background:var(--soft);color:var(--muted);font:500 14px var(--head);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fchip.on{background:var(--navy);color:var(--card)}
.fchip .fc{min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.lh{font:600 13px var(--head);color:var(--muted);padding:14px 0 0;letter-spacing:.6px}
#tabChats{position:relative}
#astrip{position:absolute;right:2px;top:200px;bottom:40px;z-index:5;display:none;flex-direction:column;justify-content:space-between;align-items:center;font:600 10px var(--head);color:var(--muted);touch-action:none;-webkit-user-select:none;user-select:none;padding:2px 6px}
#astrip.on{display:flex}
#astrip span{line-height:1;padding:1px 0}
.dgate{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.dg-card{width:min(440px,100%);background:var(--card);border-radius:32px;padding:28px 24px 22px;text-align:center;box-shadow:0 20px 60px rgba(45,42,94,.12);animation:moin .2s ease-out}
.dg-ic{width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--card);display:grid;place-items:center;margin:0 auto 14px}
.dg-ic svg{width:30px;height:30px}
.dg-card h2{font:600 22px var(--head);color:var(--navy);margin:0 0 8px}
.dg-card p{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 6px}
.dg-info{background:var(--soft);border-radius:18px;padding:6px 16px;margin:14px 0;text-align:left}
.dg-info div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13.5px;color:var(--navy)}
.dg-info small{color:var(--muted);font-size:13px}
.dg-info div+div{border-top:1px solid var(--line)}
.dg-code{width:100%;height:60px;border-radius:30px;border:2px solid transparent;background:var(--soft);text-align:center;font:600 28px var(--head);letter-spacing:10px;color:var(--navy);outline:none;margin:6px 0 4px}
.dg-code:focus{border-color:var(--blue)}
.dg-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:18px 0 12px}
.dg-or::before,.dg-or::after{content:"";flex:1;height:1px;background:var(--line)}
.dg-big{font:700 38px var(--head);letter-spacing:8px;color:var(--navy);margin:10px 0 14px}
.dg-card .link{display:block;margin:12px auto 0}
.dg-card .dg-small{font-size:12.5px;color:var(--muted);margin-top:18px;text-decoration:underline;text-underline-offset:3px}
.sec{margin-bottom:22px}
.sec h3{font:500 13px var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 10px}
.me-card{display:flex;gap:16px;align-items:center;padding:6px 0 18px}
.me-card .n{font:600 22px var(--head);color:var(--navy)}
.me-card .e{color:var(--muted);font-size:14px;word-break:break-all}
.uidbox{background:var(--soft);border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.uidbox small{display:block;color:var(--muted);font-size:12px}
.uidbox b{font:600 24px var(--head);color:var(--navy);letter-spacing:1.5px}
.item{display:flex;align-items:center;gap:14px;padding:14px 4px;width:100%;text-align:left;color:var(--navy);font-weight:500;border-bottom:1px solid var(--line)}
.item svg{color:var(--muted)}
.item .sub{display:block;color:var(--muted);font-weight:400;font-size:13px}
.item.danger{color:var(--danger)}.item.danger svg{color:var(--danger)}
.note{background:var(--soft);border-radius:18px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.55;display:flex;gap:10px}
.note svg{width:20px;height:20px;color:var(--blue);margin-top:1px}

/* ---------- right: chat card ---------- */
.chat-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;line-height:1.6}
.chat-empty .lk{width:84px;height:84px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 18px;color:var(--blue)}
.chat-empty .lk svg{width:38px;height:38px}
.chat-empty b{display:block;color:var(--navy);font:600 20px var(--head);margin-bottom:4px}
.chead{padding:56px 32px 0;display:grid;grid-template-columns:48px 1fr 48px;align-items:start;flex:none}
.chead .mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.chead .mid .nm{font:500 19px var(--head);color:var(--navy);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .icon-btn{color:var(--navy);margin-top:18px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:26px 32px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.e2e{align-self:center;background:var(--soft);color:var(--muted);font-size:12px;padding:7px 14px;border-radius:14px;display:flex;gap:6px;align-items:center;text-align:center;margin-bottom:10px;max-width:92%}
.e2e svg{width:14px;height:14px;flex:none}
.day{align-self:center;color:var(--muted);font-size:12px;margin:8px 0}
.m{display:flex;flex-direction:column;max-width:86%;margin-top:6px}
.m.me{align-self:flex-end;align-items:flex-end}
.m.them{align-self:flex-start;align-items:flex-start}
.bub{padding:16px 30px 16px 30px;font-size:17px;line-height:1.45;word-break:break-word;white-space:pre-wrap;border-radius:32px}
.m.me .bub{background:var(--blue);color:#fff;border-bottom-right-radius:0}
.m.them .bub{background:var(--soft);color:var(--ink);border-bottom-left-radius:0}
.m .ts{font-size:15px;color:var(--muted);margin-top:7px}
.m.sticker .bub{background:none!important;padding:0;font-size:96px;line-height:1.1}
.m.img .bub{padding:4px;border-radius:24px}
.m.img.me .bub{border-bottom-right-radius:0}.m.img.them .bub{border-bottom-left-radius:0}
.bub img{display:block;max-width:100%;max-height:300px;border-radius:20px;cursor:zoom-in}
.m.locked .bub{font-style:italic;opacity:.8}
.voice{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 22px;min-width:250px}
.m.voicem .bub{padding:0}
.wave{display:flex;align-items:center;gap:2px;height:44px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:#C9CBD8;min-height:3px}
.wave i.p{background:var(--blue)}
.m.me .wave i{background:rgba(255,255,255,.45)}.m.me .wave i.p{background:#fff}
.vdur{font-size:16px;color:var(--navy);min-width:42px}
.m.me .vdur{color:#fff}
.play{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.m.me .play{background:#fff;color:var(--blue)}
.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.typing{height:30px;padding:0 32px;color:var(--muted);font-size:16px;display:flex;align-items:center;gap:6px;flex:none}
.typing .d{display:inline-flex;gap:3px}
.typing .d i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing .d i:nth-child(2){animation-delay:.2s}.typing .d i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.composer{padding:8px 32px 38px;flex:none;position:relative}
.pill{height:76px;border-radius:38px;background:var(--soft);display:flex;align-items:center;gap:14px;padding:0 20px 0 14px}
.plus{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s}
.plus.open{transform:rotate(45deg)}
.plus svg{width:26px;height:26px;stroke-width:2.2}
.pill input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:18px;color:var(--navy)}
.pill input::placeholder{color:#9A9EB8}
.pill .em{color:var(--blue);width:36px;height:36px;display:grid;place-items:center}
.pill .em svg{width:32px;height:32px;stroke-width:1.5}
.sendb{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.sendb{-webkit-appearance:none;appearance:none;border:0;outline:none;-webkit-tap-highlight-color:transparent}
.sendb:focus,.sendb:focus-visible,.sendb:active{outline:none;box-shadow:none;border:0}
.sendb svg{width:22px;height:22px;pointer-events:none}
.menu{position:absolute;left:32px;bottom:122px;background:var(--card);border-radius:22px;box-shadow:0 14px 40px rgba(40,60,120,.18);padding:8px;z-index:5;min-width:190px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;color:var(--navy);font-weight:500}
.menu button:hover{background:var(--soft)}
.menu svg{color:var(--blue)}
.emoji{position:absolute;left:20px;right:20px;bottom:104px;background:var(--card);border-radius:24px;box-shadow:0 14px 40px rgba(40,60,120,.22);z-index:5;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line,#E4E7F5)}
.emoji .etabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line,#E4E7F5)}
.emoji .etabs button{flex:1;height:38px;font-size:20px;border-radius:10px 10px 0 0;opacity:.55;position:relative}
.emoji .etabs button.on{opacity:1}
.emoji .etabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:3px;border-radius:3px;background:var(--blue)}
.emoji .elabel{padding:10px 16px 2px;font:600 12px var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.emoji .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));padding:6px 10px 12px;height:210px;overflow-y:auto;align-content:start}
.emoji .egrid button{font-size:26px;height:42px;border-radius:12px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.emoji .egrid button:hover,.emoji .egrid button:active{background:var(--soft)}
.emoji .eempty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.gifp{position:absolute;left:20px;right:20px;bottom:104px;background:var(--card);border-radius:24px;box-shadow:0 14px 40px rgba(40,60,120,.22);z-index:5;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);padding:12px 12px 8px}
.gifp .gs{width:100%;height:42px;border:0;border-radius:21px;background:var(--soft);padding:0 16px;outline:none;color:var(--ink);font-size:16px;margin-bottom:10px}
.gifp .gg{column-count:2;column-gap:8px;height:300px;overflow-y:auto}
.gifp .gi{break-inside:avoid;margin-bottom:8px;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--soft)}
.gifp .gi:active{transform:scale(.96)}
.gifp .gi img{display:block;width:100%;height:auto}
.gifp .ge{column-span:all;text-align:center;color:var(--muted);padding:40px 12px;font-size:14px}
.gifp .gp{text-align:center;font-size:11px;color:var(--muted);padding-top:6px}
.bub img.gifimg{cursor:default;max-width:240px;min-width:120px;background:rgba(127,127,127,.15)}
/* no pinch / double-tap zoom */
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* chat wallpaper */
.msgs.wp .day,.msgs.wp .e2e{background:color-mix(in srgb,var(--card) 80%,transparent);padding:4px 12px;border-radius:12px}
.msgs.wp .m .ts{display:inline-block;background:color-mix(in srgb,var(--card) 80%,transparent);padding:2px 9px;border-radius:10px;font-size:12px;margin-top:4px}
.wpseg{display:flex;background:var(--soft);border-radius:14px;padding:3px;margin:10px 0 14px}
.wpseg button{flex:1;height:36px;border-radius:11px;color:var(--muted);font-weight:500;font-size:14px}
.wpseg button.on{background:var(--card);color:var(--navy);box-shadow:0 2px 8px rgba(40,60,120,.12)}
.wpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.wpgrid button{aspect-ratio:3/4;border-radius:14px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(127,127,127,.2);font-size:12px;color:var(--muted);display:grid;place-items:center;background-size:cover;background-position:center}
.wpgrid button.sel{border-color:var(--blue)}
.wpgrid button.def{background-color:var(--soft)}
.wpgrid button svg{width:22px;height:22px}
.chk{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin:0 6px 14px}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.chead .mid{cursor:pointer}
/* contact profile (iMessage-style, minimal) */
.ci{position:absolute;inset:0;background:var(--card);z-index:8;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}
.ci::-webkit-scrollbar{display:none}
.ci-top{padding:56px 26px 0;display:flex;justify-content:flex-end;flex:none}
.ci-top button{color:var(--blue);font-weight:500;font-size:17px}
.ci{overflow-y:auto!important;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;min-height:0;padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 24px))!important}
.ci>*{flex-shrink:0}
.ci-top{position:sticky;top:0;z-index:2;background:var(--card);padding-bottom:6px}
.ci-hero{display:flex;flex-direction:column;align-items:center;padding:6px 24px 0;text-align:center}
.ci-hero .av{cursor:zoom-in}
.ci-hero h2{font:600 28px var(--head);color:var(--navy);margin:16px 0 2px;letter-spacing:-.3px;word-break:break-word}
.ci-hero .st{color:var(--muted);font-size:14.5px;min-height:20px}
.ci-acts{display:flex;gap:10px;padding:22px 24px 4px}
.ci-acts button{flex:1;background:var(--soft);border-radius:16px;padding:13px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--blue);font-size:12px;font-weight:500}
.ci-acts button svg{width:22px;height:22px;color:var(--blue)}
.ci-acts button.dg,.ci-acts button.dg svg{color:var(--danger)}
.ci-group{background:var(--soft);border-radius:18px;margin:14px 24px 0;overflow:hidden}
.ci-row{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.ci-row:last-child{border-bottom:0}
.ci-row small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.ci-row span{color:var(--navy);font-size:16px;word-break:break-word;white-space:pre-wrap}
.ci-row.ic{display:flex;align-items:center;gap:12px;color:var(--navy);font-size:15px}
.ci-row.ic svg{width:20px;height:20px;color:var(--muted);flex:none}
.ci-row.dg,.ci-row.dg svg{color:var(--danger)}
.ci-h{margin:20px 30px 8px;font:500 12.5px var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.ci-media{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.ci-media>div{aspect-ratio:1;background:rgba(127,127,127,.15);border-radius:8px;overflow:hidden;cursor:pointer}
.ci-media img{width:100%;height:100%;object-fit:cover;display:block}
.in{width:100%;height:54px;border-radius:27px;border:2px solid transparent;background:var(--soft);padding:0 22px;outline:none;font-size:16px;color:var(--navy);margin-bottom:10px}
.in:focus{border-color:var(--blue);background:var(--card)}
/* iMessage typing bubble */
.m.tbub{margin-top:6px}
.bub.tb{display:flex;gap:5px;align-items:center;padding:15px 18px;border-radius:22px;border-bottom-left-radius:6px}
.tb i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.35;animation:tbd 1.3s infinite}
.tb i:nth-child(2){animation-delay:.18s}.tb i:nth-child(3){animation-delay:.36s}
@keyframes tbd{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sn{font-size:12.5px;font-weight:600;margin:0 10px 3px}
.rcpt{align-self:flex-end;font-size:12.5px;color:var(--muted);margin:3px 4px 0;display:flex;align-items:center;gap:5px}
.rcpt .av{width:16px!important;height:16px!important;font-size:8px!important}
.sysm{align-self:center;text-align:center;color:var(--muted);font-size:12.5px;margin:8px 0;max-width:88%}
.chead .mid .gs{font-size:12.5px;color:var(--muted);margin-top:-4px}
/* switches */
.sw{position:relative;width:51px;height:31px;flex:none;display:block}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:rgba(127,127,127,.35);border-radius:16px;transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:#34C759}
.sw input:checked+span::after{transform:translateX(20px)}
/* group */
.ck2{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:#fff}
.ck2.on{background:var(--blue);border-color:var(--blue)}
.ck2.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border-bottom:1px solid var(--line);text-align:left}
.mrow:last-child{border-bottom:0}
.mrow .mn{flex:1;color:var(--navy);font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm{font-size:12px;color:var(--blue);background:rgba(59,130,246,.12);padding:3px 9px;border-radius:9px;font-weight:600}
/* polls */
.m.pollb .bub,.m.me.pollb .bub{padding:14px 16px;min-width:250px;white-space:normal;background:var(--soft);color:var(--ink)}
.m.me.pollb .bub{border-bottom-right-radius:8px}
.pq{font:600 16px var(--head);margin-bottom:2px;color:var(--navy);word-break:break-word}
.pn{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.po{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--card);margin-bottom:6px;overflow:hidden;color:var(--navy);font-size:15px}
.po .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(59,130,246,.2);transition:width .3s}
.po>span{position:relative}
.po .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.po.multi .ck{border-radius:6px}
.po.on .ck{background:var(--blue);border-color:var(--blue)}
.po.on .ck::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.po .t{flex:1;word-break:break-word}
.po .c{font-size:13px;color:var(--muted)}
.pf{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.pf button{color:var(--blue);font-weight:500}
/* full-screen chat wallpaper (behind header + composer, no bezels) */
#chatCard{isolation:isolate}
.wpl{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center}
.chead,.msgs,.composer,.blockbar{position:relative;z-index:1}
.wpon .chead .nm,.wpon .chead .gs{background:color-mix(in srgb,var(--card) 78%,transparent);padding:3px 12px;border-radius:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.wpon .chead .icon-btn{background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.wpon .pill,.wpon .blockbar{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.wpblur{display:flex;align-items:center;gap:12px;margin:0 2px 14px;color:var(--muted);font-size:14px}
.wpblur b{color:var(--navy);font-weight:500;min-width:44px}
.wpblur input{flex:1;accent-color:var(--blue)}
.wpblur span{min-width:34px;text-align:right}
.rec{display:flex;align-items:center;gap:14px;width:100%}
.rec .t{flex:1;color:var(--danger);font-weight:600;display:flex;gap:8px;align-items:center}
.rec .t::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
.rec .x{color:var(--muted)}

/* ---------- auth / setup ---------- */
.solo{padding:64px 40px 40px;overflow-y:auto;flex:1;display:flex;flex-direction:column;scrollbar-width:none}
.logo{width:76px;height:76px;border-radius:26px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 0 26px;box-shadow:0 14px 30px rgba(59,130,246,.4)}
.logo svg{width:38px;height:38px;stroke-width:1.5}
.solo h1{font:600 36px/1.15 var(--head);color:var(--navy);margin:0 0 8px}
.solo p.sub{color:var(--muted);margin:0 0 26px;line-height:1.55}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 6px}
.field input,.field textarea{width:100%;height:54px;border-radius:27px;border:2px solid transparent;background:var(--soft);padding:0 22px;outline:none;font-size:16px;color:var(--navy)}
.field textarea{height:84px;padding:14px 22px;resize:none;border-radius:26px}
.field input:focus,.field textarea:focus{border-color:var(--blue);background:var(--card)}
.btn{height:56px;border-radius:28px;background:var(--blue);color:#fff;font:500 17px var(--head);width:100%;box-shadow:0 12px 24px rgba(59,130,246,.35);margin-top:6px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--soft);color:var(--navy);box-shadow:none}
.btn.line{background:none;box-shadow:none;border:2px solid var(--line);color:var(--navy)}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:2px 6px 8px}
.tabs{display:flex;background:var(--soft);border-radius:27px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;height:44px;border-radius:23px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--card);color:var(--navy);box-shadow:0 4px 14px rgba(40,60,120,.1)}
.or{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 4px}
.link{color:var(--blue);font-weight:500;font-size:14px}
.pick{display:flex;justify-content:center;margin-bottom:22px}
.pick .av{cursor:pointer}
.pick .cam{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:3px solid var(--card)}
.pick .cam svg{width:16px;height:16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,28,60,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.sheet{background:var(--card);border-radius:36px;padding:30px;width:min(420px,100%);max-height:92vh;overflow:auto}
.sheet h2{font:600 24px var(--head);color:var(--navy);margin:0 0 6px}
.sheet p{color:var(--muted);margin:0 0 18px;line-height:1.5;font-size:14.5px}
.sheet ol{color:var(--ink);line-height:1.8;padding-left:20px;font-size:14.5px;margin:0 0 14px}
.qrimg{display:grid;place-items:center;margin:8px 0}
.qrimg img{width:240px;height:240px;border-radius:18px;border:1px solid var(--line);background:#fff}
.found{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:22px;padding:14px;margin:6px 0 14px}
.found .n{font:500 17px var(--head);color:var(--navy)}.found .u{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#22264a;color:#fff;padding:13px 22px;border-radius:24px;z-index:99;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
#scan{position:fixed;inset:0;background:#000;z-index:80}
#scan video{width:100%;height:100%;object-fit:cover}
#scan .tt{position:absolute;top:0;left:0;right:0;padding:26px;color:#fff;font-weight:600;text-align:center;background:linear-gradient(#000a,transparent)}
#scan button{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:13px 30px;border-radius:30px;font-weight:600}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:grid;place-items:center;cursor:zoom-out}
#viewer img{max-width:94vw;max-height:92vh;border-radius:12px}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .stage{padding:0;gap:0;display:block;height:100dvh;min-height:0}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  body:not(.chat-open) #chatCard{display:none}
  body.chat-open #listCard{display:none}
  .panel-top{padding-top:max(46px,env(safe-area-inset-top))}
  .chead{padding-top:max(34px,env(safe-area-inset-top))}
  .nav{height:96px}
  .fab{bottom:114px;width:68px;height:68px}
}
@media (max-width:420px){
  .panel{padding:0 20px}.scroll{margin:0 -20px;padding:0 20px 90px}
  .panel-top h1{font-size:34px}
  .msgs{padding:20px 18px 8px}.composer{padding:6px 16px 22px}.chead{padding-left:18px;padding-right:18px}
  .typing{padding:0 18px}
  .bub{padding:14px 22px;font-size:16px}
  .solo{padding:48px 24px 28px}
}

/* block / report / moderation */
.blockbar{display:flex;gap:10px;justify-content:center;align-items:center;margin:0 24px 24px;padding:16px 20px;background:var(--soft);border-radius:24px;color:var(--muted);font-size:14px;flex:none}
.item.rsn{border-radius:14px;border-bottom:0;padding:11px 14px}
.item.rsn.sel{background:var(--soft);color:var(--blue);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink);margin:10px 4px;line-height:1.45}
.chk input{margin-top:3px;flex:none}
.sheet.modsheet{width:min(560px,100%)}
.modcard{background:var(--soft);border-radius:22px;padding:14px 16px;margin-bottom:14px}

.from{margin-top:auto;position:sticky;bottom:0;background:var(--card);padding:14px 0 max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
body.kb .from{display:none}
.from small{font-size:11.5px;letter-spacing:.4px;color:var(--muted)}

svg.ei{width:1.05em;height:1.05em;vertical-align:-.17em;margin-right:2px;display:inline-block}
.row.arch .ico svg{width:32px;height:32px}
.row .pinm svg{width:13px;height:13px;vertical-align:-2px}
#astrip span svg{width:11px;height:11px}
.emoji .etabs button svg{width:22px;height:22px}
.emoji .etabs button.on svg{color:var(--blue)}
.fxrow .em2 svg{width:26px;height:26px}
.locc .lpin svg{width:40px;height:40px}
.pill-call svg{vertical-align:-3px}

.vbadge{width:1.1em;height:1.1em;margin-left:5px;vertical-align:-.2em;display:inline-block;flex:none;-webkit-user-drag:none;user-select:none}
.chead .nm .vbadge{width:19px;height:19px;vertical-align:-4px}
.ci-hero h2 .vbadge{width:24px;height:24px;vertical-align:-5px}
.row .name .vbadge{width:17px;height:17px;vertical-align:-3px}

/* ---- platform look: iPhone = grouped inset lists, Android = Material You ---- */
html.p-ios :is(.setv,.spb) .sec{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:24px}
html.p-ios :is(.setv,.spb) .sec h3{padding:12px 16px 2px;margin:0;font-size:12px}
html.p-ios :is(.setv,.spb) .item{padding:12px 16px;border-bottom:0;position:relative;min-height:52px}
html.p-ios :is(.setv,.spb) .item:not(:last-child)::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:1px;background:var(--line)}
html.p-ios :is(.setv,.spb) .item svg:not(.chev){color:var(--blue)}
html.p-ios :is(.setv,.spb) .item:active{background:var(--soft)}
html.p-ios .uidbox{border-radius:14px}
html.p-ios .sph{justify-content:flex-start;min-height:48px;border-bottom:1px solid var(--line)}
html.p-ios .sph h2{position:absolute;left:56px;right:56px;text-align:center;font:600 17px var(--head);pointer-events:none}
html.p-ios .spage{background:var(--bg)}
html.p-android :is(.setv,.spb) .sec{margin-bottom:12px}
html.p-android :is(.setv,.spb) .sec h3{color:var(--blue);text-transform:none;letter-spacing:.1px;font:500 14px var(--head);margin:6px 8px 4px}
html.p-android :is(.setv,.spb) .item{border-bottom:0;border-radius:18px;padding:14px 12px;transition:background .15s}
html.p-android :is(.setv,.spb) .item:active{background:var(--soft)}
html.p-android :is(.setv,.spb) .item .chev{display:none}
html.p-android .uidbox{border-radius:28px}
html.p-android .sph h2{font:500 22px var(--head)}
html.p-android :is(.setv,.spb) .sw{width:52px;height:32px}

<noscript><main style="font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;line-height:1.6">
<h1>marsX – Private End-to-End Encrypted Messenger</h1>
<p>marsX is a private messaging app with end-to-end encryption. Send secure messages, photos, voice notes, GIFs and your location, and make free voice and video calls.</p>

      <button class="btn" id="otpGo">Verify &amp; create account</button>

        <button class="link" id="otpResend" disabled>Resend code</button>
      </div>
    </div>
    <div id="formStep">
    <div class="field"><label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="aPass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
    <div class="field hidden" id="aPass2w"><label>Confirm password</label><input id="aPass2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
    <div class="err" id="aErr"></div>
    <button class="btn" id="aGo">Sign in</button>

</div>

<div class="stage hidden" id="setupStage">

    <button class="btn" id="suSave">Continue</button>
    <button class="btn ghost hidden" id="suCancel">Cancel</button>

</div>

/* =====================================================================
   E2EE  — per-device ECDH P-256 keys, per-message AES-GCM key,
   message key wrapped separately for every device of both users.
   Private keys are non-extractable and live only in this browser's IndexedDB.
   ===================================================================== */
const ECDH = {name:'ECDH', namedCurve:'P-256'};
function idb(){
  return new Promise((ok,no)=>{ const r=indexedDB.open('msgr-e2ee',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); });
}
async function idbGet(k){ const d=await idb(); return new Promise((ok,no)=>{ const r=d.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); }
async function idbSet(k,v){ const d=await idb(); return new Promise((ok,no)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>ok(); t.onerror=()=>no(t.error); }); }

async function loadOrCreateDevice(uid){
  let d = await idbGet('dev:'+uid);
  if(!d){
    const kp = await crypto.subtle.generateKey(ECDH, false, ['deriveKey']);       // private key: non-extractable
    const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
    d = { id: hex(rand(6)), priv: kp.privateKey, pub: JSON.stringify(pub) };
    await idbSet('dev:'+uid, d);
  }
  return d;
}
async function importPub(jwkStr){ return crypto.subtle.importKey('jwk', JSON.parse(jwkStr), ECDH, false, []); }
async function wrapKeyFor(myPriv, theirPubStr){
  let m = wrapCache.get(myPriv); if(!m){ m = new Map(); wrapCache.set(myPriv, m); }
  let p = m.get(theirPubStr);
  if(!p){
    p = importPub(theirPubStr).then(pub=>crypto.subtle.deriveKey({name:'ECDH', public:pub}, myPriv, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']));
    m.set(theirPubStr, p); p.catch(()=>m.delete(theirPubStr));
  }
  return p;
}
// bytes -> {iv, ct, keys:{deviceId:{i,c}}}
async function e2eeEncrypt(bytes, myPriv, targets /* {devId: pubJwkString} */, mediaBytes){
  const mk = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt']);
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, mk, bytes);
  const raw = await crypto.subtle.exportKey('raw', mk);
  const keys = {};
  await Promise.all(Object.entries(targets).map(async ([id,pub])=>{
    try{
      const sk = await wrapKeyFor(myPriv, pub), wiv = rand(12);
      keys[id] = { i:b64(wiv), c:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv:wiv}, sk, raw)) };
    }catch(e){ console.warn('skip device', id, e); }
  }));
  let media = null;
  if(mediaBytes){ const miv = rand(12); media = { iv:b64(miv), ct:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv:miv}, mk, mediaBytes)) }; }
  return { iv:b64(iv), ct:b64(ct), keys, media };
}
async function e2eeUnwrap(rec, myDevId, myPriv, senderPubStr){
  const w = rec.k && rec.k[myDevId]; if(!w) return null;
  const sk = await wrapKeyFor(myPriv, senderPubStr);
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(w.i)}, sk, unb64(w.c));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']);
}
async function e2eeDecryptBody(rec, mk){ return crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(rec.iv)}, mk, unb64(rec.ct)); }
async function e2eeDecryptMedia(m, mk){ return crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(m.iv)}, mk, unb64(m.ct)); }

let otpBusy=false, otpEmail='', otpTimer=null;
async function otpApi(path,body){
  let r; try{ r=await fetch(OTP_WORKER+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Network error. Check your connection.'); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Something went wrong. Try again.');
  return j;
}
function otpCooldown(sec){
  const b=$('#otpResend'); clearInterval(otpTimer); b.disabled=true;
  const tick=()=>{ if(sec<=0){ clearInterval(otpTimer); b.disabled=false; b.textContent='Resend code'; } else { b.textContent='Resend in '+sec+'s'; sec--; } };
  tick(); otpTimer=setInterval(tick,1000);
}

    try{ await auth.currentUser.linkWithCredential(firebase.auth.EmailAuthProvider.credential(otpEmail,pass)); }

function resizeImage(fileOrBlob, max, q, square){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(fileOrBlob), img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'), ctx=c.getContext('2d');
      if(square){
        const side=Math.min(img.width,img.height), sx=(img.width-side)/2, sy=(img.height-side)/2, out=Math.min(max,side);
        c.width=c.height=out; ctx.drawImage(img,sx,sy,side,side,0,0,out,out);
      } else {
        const s=Math.min(1,max/Math.max(img.width,img.height)); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); ctx.drawImage(img,0,0,c.width,c.height);

}

const marsVerified=new Set(); let firstGateOpen=false;
function firstTimeGate(user){
  return new Promise(resolve=>{
    const email=user.email; if(!email||firstGateOpen){ resolve(!!email===false); return; }
    firstGateOpen=true; let last=0;
    const gate=h('div',{class:'dgate'}); document.body.append(gate);
    const err=h('div',{class:'err',style:'min-height:20px;margin:6px 0 0'});
    const inp=h('input',{class:'dg-code',inputmode:'numeric',autocomplete:'one-time-code',maxlength:6,placeholder:'••••••',oninput:e=>{ e.target.value=e.target.value.replace(/\D/g,'').slice(0,6); if(e.target.value.length===6) verify(); }});
    const go=h('button',{class:'btn',style:'margin-top:10px'},'Verify');
    const end=ok=>{ firstGateOpen=false; gate.remove(); resolve(ok); };
    const send=async first=>{
      if(!first&&Date.now()-last<30000){ err.textContent='Please wait a few seconds before asking again.'; return; }
      err.textContent=''; last=Date.now();
      try{ await otpApi('/otp/send',{email}); if(!first) toast('New code sent'); }catch(e){ err.textContent=e.message||'Could not send the code.'; }
    };
    let busy=false;
    async function verify(){
      if(busy) return; if(inp.value.length!==6){ err.textContent='Enter the 6-digit code.'; return; }
      busy=true; go.disabled=true; err.textContent='';
      try{ await otpApi('/otp/verify',{email,code:inp.value}); marsVerified.add(user.uid); end(true); return; }
      catch(e){ err.textContent=e.message||'Wrong code.'; }
      busy=false; go.disabled=false;
    }
    go.onclick=verify; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') verify(); });
    gate.append(h('div',{class:'dg-card'}, h('div',{class:'dg-ic'},svg('mail')), h('h2',{},'Welcome to marsX'),
      h('p',{},'This is your first time on marsX. We sent a 6-digit code to '+maskEmail(email)+' to confirm it is you. It works for 10 minutes.'),
      inp, err, go,
      h('button',{class:'link',onclick:()=>send(false)},'Send a new code'),
      h('button',{class:'link',onclick:()=>{ end(false); auth.signOut(); }},'Log out')));
    setTimeout(()=>inp.focus({preventScroll:true}),80);
    send(true);
  });
}

/* ---------------- Picture-in-Picture (video calls keep floating over other apps) ---------------- */
const PIP={
  el(){ return callUI&&callUI.rv||null; },
  ok(){ return !!(document.pictureInPictureEnabled||(document.createElement('video').webkitSupportsPresentationMode)); },
  active(){ const v=this.el(); return !!(v&&(document.pictureInPictureElement===v||v.webkitPresentationMode==='picture-in-picture')); },
  async enter(){
    const v=this.el(); if(!v||!call||!call.v||!v.srcObject) return false;
    try{
      if(document.pictureInPictureEnabled&&v.requestPictureInPicture){ if(document.pictureInPictureElement!==v) await v.requestPictureInPicture(); }
      else if(v.webkitSetPresentationMode) v.webkitSetPresentationMode('picture-in-picture');
      else return false;
      this.sync(); return true;
    }catch(e){ return false; }
  },
  async exit(){
    try{
      if(document.pictureInPictureElement) await document.exitPictureInPicture();
      const v=this.el(); if(v&&v.webkitPresentationMode==='picture-in-picture') v.webkitSetPresentationMode('inline');
    }catch(_){}
    this.sync();
  },
  async toggle(){ if(this.active()) await this.exit(); else if(!(await this.enter())) toast('Picture-in-picture is not available right now'); },
  sync(){ const b=document.getElementById('pipBtn'); if(b) b.classList.toggle('on',this.active()); },
  init(){
    document.addEventListener('leavepictureinpicture',()=>this.sync(),true);
    document.addEventListener('enterpictureinpicture',()=>this.sync(),true);
    // Chrome/Edge: browser offers automatic PiP when the person leaves the tab during a video call
    try{ navigator.mediaSession&&navigator.mediaSession.setActionHandler('enterpictureinpicture',()=>{ this.enter(); }); }catch(_){}
    // fallback for browsers without the auto-PiP action
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='hidden'&&call&&call.v&&call.state==='connected'&&!this.active()) this.enter();
    });
  }
};
PIP.init();

/* ---------------- offline outbox + Background Sync ---------------- */
const OUTBOX=(()=>{
  const DB='marsx-outbox',ST='q'; let dbp=null, flushing=false;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('no idb')); const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id',autoIncrement:true}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=async(mode,fn)=>{ const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction(ST,mode); const out=fn(t.objectStore(ST)); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); };
  const SKIP=['call','calllog','sys'];
  return {
    can(payload){ return !!(payload&&!SKIP.includes(payload.t)&&window.indexedDB); },
    async add(uid,payload,media){
      if(!me) return;
      await tx('readwrite',st=>st.add({me:me.uid,uid,payload,media:media||null,at:Date.now()}));
      try{ navigator.serviceWorker.ready.then(reg=>reg.sync&&reg.sync.register('marsx-outbox')).catch(()=>{}); }catch(_){}   // fire-and-forget: .ready never resolves without a worker
    },
    async all(){ return tx('readonly',st=>st.getAll()).catch(()=>[]); },
    async count(){ try{ return (await this.all()).filter(x=>me&&x.me===me.uid).length; }catch(_){ return 0; } },
    async flush(){
      if(flushing||!me||!appReady||navigator.onLine===false) return; flushing=true; let sent=0;
      try{
        const items=(await this.all()).filter(x=>x.me===me.uid).sort((a,b)=>a.id-b.id);
        for(const it of items){
          if(Date.now()-it.at>24*3600*1000){ await tx('readwrite',st=>st.delete(it.id)); continue; }   // too old, drop
          try{ await sendPayload(it.uid,it.payload,it.media,true); await tx('readwrite',st=>st.delete(it.id)); sent++; }
          catch(e){ break; }   // still offline / failed — keep the rest, try again later
        }
      }catch(_){}
      flushing=false; if(sent) toast(sent===1?'Queued message sent':sent+' queued messages sent');
    }
  };
})();
window.addEventListener('online',()=>{ setTimeout(()=>OUTBOX.flush(),600); });
try{ navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{ const m=e.data&&e.data.marsx; if(m==='flush-outbox') OUTBOX.flush(); else if(m==='resubscribe') setupPush(); }); }catch(_){}

let monteOn=false;
function monteText(m){
  const first=String(myProf&&myProf.name||'').split(' ')[0];
  const fill=x=>String(x||'').replace(/\{first\}/gi,first||'there');
  const parts=[]; if(m.title) parts.push(fill(m.title).slice(0,160)); if(m.body) parts.push(fill(m.body).slice(0,2000));
  if(m.link&&/^https?:\/\//i.test(String(m.link))) parts.push('View on MONTÈ: '+String(m.link).slice(0,500));
  return parts.join('\n\n');
}
function monteItem(id,m){ const ts=Number(m.ts)||Date.now(); return { key:'mt'+id, from:MONTE_UID, ts, rec:{from:MONTE_UID,fd:'kai',ts}, p:{t:'text',text:monteText(m)}, mk:null, locked:false }; }
function monteAdd(it,live){
  const t=threads[MONTE_UID]; if(!t||t.items.some(x=>x.key===it.key)) return;
  if(it.ts<=clrTs(chatCid(MONTE_UID))||isDeletedLocal(MONTE_UID,it.key)) return;
  t.items.push(it); t.items.sort((a,b)=>a.ts-b.ts||(a.key<b.key?-1:1)); t.last=t.items[t.items.length-1];
  const lr=getLR(MONTE_UID); t.unread=t.items.filter(i=>i.from!==me.uid&&i.ts>lr).length;
  if(openUid===MONTE_UID){ if(document.visibilityState==='visible'){ setLR(MONTE_UID,Math.max(Date.now(),it.ts)); t.unread=0; } appendMsg(it); }
  else if(live&&PREF.get('nall')&&PREF.get('nsnd')&&!isMuted(MONTE_UID)) beep('msg');
  renderList();
}
async function initMonte(){
  monteOn=false; const uid=me.uid; if(!uid) return;
  const alive=()=>me&&me.uid===uid;
  const show=()=>{
    if(monteOn||!alive()) return; monteOn=true;
    contacts[MONTE_UID]={ uid:MONTE_UID, name:'MONTÈ', pname:'MONTÈ', photo:MONTE_LOGO, verified:true, bot:true,
      about:'Official MONTÈ account. New product launches, discounts and offers for MONTÈ customers.',
      links:[{t:'Website',u:MONTE_SITE}] };
    presence[MONTE_UID]={online:true};
    threads[MONTE_UID]={ items:[], last:null, unread:0, chain:Promise.resolve(), votes:{}, reacts:{} };
    let w=0; try{ w=Number(localStorage.getItem('monte:w:'+uid))||0; if(!w){ w=Date.now(); localStorage.setItem('monte:w:'+uid,String(w)); } }catch(_){ w=Date.now(); }
    monteAdd({ key:'mtwelcome', from:MONTE_UID, ts:w, rec:{from:MONTE_UID,fd:'kai',ts:w}, mk:null, locked:false,
      p:{t:'text',text:'Welcome to MONTÈ on marsX.\n\nAs a MONTÈ customer, this is where you will receive our official updates: new product launches, discounts and private offers, all in one place.\n\nThis chat is read-only. To browse or shop, visit '+MONTE_SITE}},false);
    renderList();
  };
  let has=false; try{ has=(await db.ref('users/'+uid).once('value')).exists(); }catch(_){}
  if(!alive()) return;
  const q=db.ref('monteInbox/'+uid).limitToLast(100);
  const addf=q.on('child_added',s=>{ const v=s.val(); if(!v||!alive()) return; show(); monteAdd(monteItem(s.key,v),Date.now()-(Number(v.ts)||0)<120000); },()=>{});
  const remf=q.on('child_removed',s=>{ const t=threads[MONTE_UID]; if(!t||!alive()) return;
    t.items=t.items.filter(i=>i.key!=='mt'+s.key); t.last=t.items[t.items.length-1]||null;
    const lr=getLR(MONTE_UID); t.unread=t.items.filter(i=>i.from!==me.uid&&i.ts>lr).length;
    if(openUid===MONTE_UID) renderChat(); renderList(); },()=>{});
  watchers.push(()=>{ try{ q.off('child_added',addf); q.off('child_removed',remf); }catch(_){} });
  if(has) show();
  else if(contacts[MONTE_UID]&&contacts[MONTE_UID].ghost){ delete contacts[MONTE_UID]; delete threads[MONTE_UID]; renderList(); }
}

function sortedContacts(){
  return Object.values(contacts).sort((a,b)=>{
    const ta=threads[a.uid]&&threads[a.uid].last?threads[a.uid].last.ts:0, tb=threads[b.uid]&&threads[b.uid].last?threads[b.uid].last.ts:0;
    return tb-ta || a.name.localeCompare(b.name);
  });
}

/* ---------------- view once photos ----------------
   Instagram-style: choose "View once" or "Allow replay", press & hold to view, release = closed.
   Screenshot protection on the web is best-effort (see the deterrents below). */
const VO_SHIELD=true;       // scramble the picture frame-by-frame so a screenshot only catches half of it
const VO_MAX_MS=15000;      // auto-close after 15 s (story-style progress bar)
const VO_GAIN=1.35;         // brightness boost that makes up for the scramble effect
const voEls=new Map(), voBusy=new Set();
const voCount=k=>{ try{ return Math.min(2,+localStorage.getItem('voo:'+k)||0); }catch(_){ return 0; } };
const voMark=(k,n)=>{ try{ if(voCount(k)<n) localStorage.setItem('voo:'+k,String(n)); }catch(_){} };
const voShot=k=>{ try{ return localStorage.getItem('vss:'+k)==='1'; }catch(_){ return false; } };
const voShotMark=k=>{ try{ localStorage.setItem('vss:'+k,'1'); }catch(_){} };
const voLimit=it=>(it.p&&it.p.rp)?2:1;
function wipeOnceMedia(uid,key){ mediaCache.delete(key); R(`chats/${chatCid(uid)}/media/${key}`).remove().catch(()=>{}); }
function voDone(uid,it,r){
  const n=Math.max(1,Math.min(2,Number(r&&r.n)||1)); voMark(it.key,n); if(r&&r.ss) voShotMark(it.key);
  const f=voEls.get(it.key); if(f) f();
  if(it.from===me.uid && voCount(it.key)>=voLimit(it)) wipeOnceMedia(uid,it.key);
}
function voView(uid,it){
  const mine=it.from===me.uid, rp=!!(it.p&&it.p.rp);
  const b=h('button',{type:'button',class:'vob'}), lb=h('b',{}), sb=h('span',{class:'vos'});
  b.append(svg(rp?'replay':'once'),h('span',{class:'vot2'},lb,sb));
  const paint=()=>{ const n=voCount(it.key), done=n>=voLimit(it), ss=mine&&voShot(it.key);
    b.classList.toggle('done',done&&!ss); b.classList.toggle('ss',ss);
    if(mine){
      lb.textContent=ss?'Screenshot suspected':done?(rp?'Replayed':'Opened'):n?'Opened':'Photo';
      sb.textContent=ss?'They may have captured it':done?(rp?'They replayed your photo':'They viewed your photo'):n?'Replay still available':(rp?'Not opened · replay allowed':'Not opened yet');
    } else {
      lb.textContent=done?'Opened':n?'Replay':'Photo';
      sb.textContent=done?'Can’t be opened again':n?'Hold to replay once':(rp?'Hold to view · replay allowed':'Hold to view');
    } };
  paint(); voEls.set(it.key,paint);
  if(!mine){
    b.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; e.preventDefault(); openOnce(uid,it,e.pointerId); });
    b.addEventListener('contextmenu',e=>e.preventDefault());
  }
  return b;
}
/* the picture is drawn on a canvas as two complementary checkerboards that swap every frame.
   Your eyes blend them into one picture, but a screenshot or a screen-recording frame only gets half the squares. */
function voShield(url,stage,done){
  let alive=true, raf=0; const im=new Image(); im.draggable=false;
  im.onerror=()=>done(false);
  im.onload=()=>{
    if(!alive) return;
    try{
      const dpr=Math.min(window.devicePixelRatio||1,3), W=stage.clientWidth||innerWidth, H=stage.clientHeight||innerHeight;
      const sc=Math.min(W/im.naturalWidth,H/im.naturalHeight), cw=Math.max(1,Math.round(im.naturalWidth*sc*dpr)), ch=Math.max(1,Math.round(im.naturalHeight*sc*dpr));
      const base=document.createElement('canvas'); base.width=cw; base.height=ch;
      const bx=base.getContext('2d',{willReadFrequently:true}); bx.drawImage(im,0,0,cw,ch);
      const src=bx.getImageData(0,0,cw,ch).data, cell=Math.max(2,Math.round(2.5*dpr));
      const mk=par=>{ const o=bx.createImageData(cw,ch), d=o.data;
        for(let y=0;y<ch;y++){ const ry=(y/cell)|0; for(let x=0;x<cw;x++){ if((((x/cell)|0)+ry&1)===par){ const i=(y*cw+x)*4; d[i]=src[i]; d[i+1]=src[i+1]; d[i+2]=src[i+2]; d[i+3]=src[i+3]; } } }
        const c=document.createElement('canvas'); c.width=cw; c.height=ch; c.getContext('2d').putImageData(o,0,0); return c; };
      const A=mk(0), B=mk(1);
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; cv.className='vocv';
      cv.style.cssText='width:'+(cw/dpr)+'px;height:'+(ch/dpr)+'px;--vogain:'+VO_GAIN;
      const cx=cv.getContext('2d'); stage.append(cv);
      let k=0; const tick=()=>{ if(!alive) return; cx.clearRect(0,0,cw,ch); cx.drawImage((k++&1)?A:B,0,0); raf=requestAnimationFrame(tick); }; tick();
      done(true);
    }catch(_){ done(false); }
  };
  im.src=url;
  return ()=>{ alive=false; cancelAnimationFrame(raf); im.onload=im.onerror=null; im.removeAttribute('src'); stage.textContent=''; };
}

async function openOnce(uid,it,pid){
  const key=it.key; if(it.from===me.uid||voCount(key)>=voLimit(it)||voBusy.has(key)) return; voBusy.add(key);
  const f=()=>{ const g=voEls.get(key); if(g) g(); };
  const n=voCount(key)+1, last=n>=voLimit(it);
  const L=[], on=(tg,ty,fn,op)=>{ tg.addEventListener(ty,fn,op); L.push([tg,ty,fn,op]); }, off=()=>L.forEach(([tg,ty,fn,op])=>tg.removeEventListener(ty,fn,op));

  const stage=h('div',{class:'vostage'});
  const wm=h('div',{class:'vowm',style:'background-image:'+voWatermark()});
  const v=h('div',{id:'voview',style:'--vomax:'+(VO_MAX_MS/1000)+'s'}, stage, wm,
    h('div',{class:'vop'},h('i',{class:'vobar'})),
    h('div',{class:'vot'},svg(n>1?'replay':'once'),h('span',{},n>1?'Replay · release to close':'View once · release to close')),
    h('div',{class:'voload'},'Loading…'),
    h('div',{class:'voh'},'Keep holding to view'));
  const finish=()=>{
    if(closed) return; closed=true;
    off(); clearTimeout(tmr); stopShield(); v.remove(); voBusy.delete(key); mediaCache.delete(key);
    f();
    if(!shown) return;                               // let go before it appeared: nothing was used up
    sendPayload(uid,{t:'vo',ref:key,n,...(flagged?{ss:1}:{})}).catch(()=>{});
  };
  const flag=()=>{ if(shown){ flagged=true; voShotMark(key); try{ navigator.clipboard&&navigator.clipboard.writeText(' ').catch(()=>{}); }catch(_){} } finish(); };
  const kd=e=>{ const c=e.code;
    if(c==='PrintScreen'||(e.metaKey&&e.shiftKey&&['Digit3','Digit4','Digit5','KeyS'].includes(c))||((e.ctrlKey||e.metaKey)&&['KeyP','KeyS'].includes(c))){ e.preventDefault(); flag(); } };
  on(document,'pointerup',e=>{ if(e.pointerId===pid) finish(); },true);
  on(document,'pointercancel',e=>{ if(e.pointerId===pid) finish(); },true);
  on(document,'pointerdown',e=>{ if(e.pointerType==='touch'&&e.pointerId!==pid) flag(); },true);   // 2nd finger: 3-finger screenshot swipes
  on(document,'visibilitychange',()=>{ if(document.hidden) finish(); });
  on(window,'blur',finish); on(window,'pagehide',finish); on(window,'beforeprint',flag);
  on(document,'keydown',kd,true); on(document,'keyup',kd,true);
  ['contextmenu','copy','cut','dragstart','selectstart'].forEach(ty=>on(document,ty,e=>e.preventDefault(),true));
  document.body.append(v);
  let url=null; try{ url=await getMedia(uid,it); }catch(_){}
  if(closed) return;                                  // released before it loaded
  if(!url){ closed=true; off(); v.remove(); voBusy.delete(key); voMark(key,voLimit(it)); wipeOnceMedia(uid,key); f(); toast('This photo is no longer available'); return; }
  const reveal=()=>{ if(closed) return; shown=true; v.classList.add('on'); voMark(key,n);
    if(last) wipeOnceMedia(uid,key);                   // final view: the stored copy is deleted as soon as it is on screen
    f(); tmr=setTimeout(finish,VO_MAX_MS); };
  const plain=()=>{ stage.append(h('img',{src:url,draggable:'false',alt:''})); reveal(); };
  if(VO_SHIELD) stopShield=voShield(url,stage,ok=>{ if(closed) return; if(ok) reveal(); else plain(); });
  else plain();
}

/* ---------------- new-device verification ----------------
   A device that signs in while you already have trusted devices must be approved first:
   1) a 6-digit code appears on your other device (with this device's name and place) and you type it here, or
   2) a one-time code is sent to your email (needs the worker in device-otp-worker.js). */
// email OTP for new devices reuses the sign-up OTP worker (OTP_WORKER: /otp/send, /otp/verify)
const DEV_CODE_URL='https://marsx-devcode.sgursharn076.workers.dev';         // device-code worker, e.g. 'https://marsx-devcode.<you>.workers.dev' (see device-code-worker.js). Empty = old browser-only check.
async function devCodeCall(path,body){ const t=await auth.currentUser.getIdToken(); const r=await fetch(DEV_CODE_URL+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)}); let j={}; try{ j=await r.json(); }catch(_){} if(!r.ok) throw new Error(j.error||'Request failed'); return j; }
/* a trusted device asks the worker for the code of a waiting device, proving it owns its private key */
async function devShowCode(target){
  const ch=await devCodeCall('/dc/challenge',{dev:dev.id});
  const peer=await crypto.subtle.importKey('jwk',ch.epub,ECDH,false,[]);
  const hk=await crypto.subtle.deriveKey({name:'ECDH',public:peer},dev.priv,{name:'HMAC',hash:'SHA-256',length:256},false,['sign']);
  const proof=hex(await crypto.subtle.sign('HMAC',hk,enc.encode(ch.id+':'+target)));
  return devCodeCall('/dc/show',{dev:dev.id,id:ch.id,proof,target});
}

async function deviceGate(){
  const all=(await R('devices/'+me.uid).once('value')).val()||{}, mine=all[dev.id];
  if(mine&&mine.ok!==false) return true;
  const trusted=Object.entries(all).filter(([id,d])=>id!==dev.id&&d.ok!==false);
  if(!trusted.length){   // your first device
    if(DEV_CODE_URL){ try{ await R(`devices/${me.uid}/${dev.id}`).set({pub:dev.pub,label:deviceLabel(),ts:TS,ok:false}); await devCodeCall('/dc/first',{dev:dev.id}); return true; }catch(e){ console.warn('first device',e); } }
    await R(`devices/${me.uid}/${dev.id}`).set({pub:dev.pub,label:deviceLabel(),ts:TS,ok:true}); return true;
  }
  await R(`devices/${me.uid}/${dev.id}`).set({pub:dev.pub,label:deviceLabel(),ts:TS,ok:false});
  return runDeviceGate();
}
function runDeviceGate(){

    const finish=ok=>{ if(done) return; done=true; okRef.off('value',l1); reqRef.off('value',l2); gate.remove(); resolve(ok); };
    const l1=okRef.on('value',s=>{ if(s.val()===true) finish(true); },()=>{});

async function checkDevReq(force){
  if(force===true){ if(devReqBusy) return toast('Please wait…'); } else if(devReqBusy||!me||!dev) return;
  if(force!==true&&(document.querySelector('#modalRoot .modal')||(typeof call!=='undefined'&&call))){ setTimeout(checkDevReq,5000); return; }
  devReqBusy=true; let shown=false;
  try{
    const v=(await R('devReq/'+me.uid).once('value')).val()||{};
    for(const [id,q] of Object.entries(v)){
      const k=id+':'+(q&&q.ts); if(id===dev.id||!q||q.status!=='pending'||devPrompted.has(k)) continue;
      if(!q.ts||Date.now()-q.ts>15*60*1000) continue;
      devPrompted.add(k);
      let code;
      if(DEV_CODE_URL){ try{ code=(await devShowCode(id)).code; }catch(e){ console.warn('device code',e); toast('Sign-in code failed: '+(e.message||e)); continue; } }   // code is made and checked by the worker
      else{
        code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
        const hsh=await sha256hex(`devcode:${me.uid}:${id}:${code}`);
        const res=await R(`devReq/${me.uid}/${id}/ch`).transaction(c=>c||hsh);
        if(!res.committed||res.snapshot.val()!==hsh) continue;                  // another device of yours is already showing a code
      }
      shown=true; devPreOk.add(id); { const kn=LSJ.get('kd:'+me.uid,null); if(kn&&!kn.includes(id)) LSJ.set('kd:'+me.uid,[...kn,id]); }
      const deny=async()=>{ closeModal(); try{ await R(`devReq/${me.uid}/${id}`).update({status:'denied'}); await R(`devices/${me.uid}/${id}`).remove(); }catch(_){} toast('Sign-in denied. Change your password if this was not you.'); };
      modal(h('div',{class:'sheet'}, h('h2',{},'New device sign-in'),
        h('p',{},'Someone is signing in to your account. If this is you, type this code on the new device.'),
        h('div',{class:'dg-big',style:'text-align:center'},code.slice(0,3)+' '+code.slice(3)),
        h('div',{class:'dg-info'},
          h('div',{},h('small',{},'Device'),h('span',{},q.label||'Unknown device')),
          h('div',{},h('small',{},'Place'),h('span',{style:'text-align:right'},q.loc||'Unknown')),
          h('div',{},h('small',{},'Time'),h('span',{},new Date(q.ts).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})))),
        h('p',{style:'color:var(--danger)'},'If this is not you, tap Deny and change your password.'),
        h('button',{class:'btn',style:'background:var(--danger);box-shadow:none',onclick:deny},'Deny'),
        h('button',{class:'btn ghost',style:'margin-top:10px',onclick:closeModal},'Close')));
      break;
    }
  }catch(e){ console.warn('device request',e); if(force===true) toast('Error: '+(e.message||e)); }
  devReqBusy=false;
  if(force===true&&!shown) toast('No waiting sign-in found. On the new device tap “Send the request again”.');
}

const HELP_EMAIL='help@kashishai.com', LEGAL_DATE='31 October 2026';
function mailSupport(subject){
  const body='\n\n---\nApp: marsX '+APP_VERSION+'\nUID: '+((myProf&&myProf.uidNum)||'')+'\nDevice: '+navigator.userAgent+'\n';
  location.href='mailto:'+HELP_EMAIL+'?subject='+encodeURIComponent(subject||'marsX support')+'&body='+encodeURIComponent(body);
}
function docSheet(title,meta,blocks,withMail){
  const out=[];
  if(meta) out.push(h('div',{style:'font-size:12.5px;color:var(--muted);margin:-4px 0 10px;text-align:left'},meta));
  blocks.forEach(b=>{
    if(b.h) out.push(h('h3',{style:'font:600 15px var(--head);color:var(--navy);margin:20px 0 6px;text-align:left;text-transform:none;letter-spacing:0'},b.h));
    (b.p||[]).forEach(t=>out.push(h('p',{style:'text-align:left;line-height:1.6;font-size:14px;margin:0 0 8px;color:var(--ink)'},t)));
    if(b.l) out.push(h('ul',{style:'text-align:left;line-height:1.6;font-size:14px;margin:0 0 8px;padding-left:20px;color:var(--ink)'},...b.l.map(x=>h('li',{style:'margin:0 0 4px'},x))));
  });
  // full-screen page (stacks above Settings instead of replacing it)
  const bd=h('div',{class:'spb',style:'padding-bottom:max(40px,env(safe-area-inset-bottom))'},...out,
    withMail?h('button',{class:'btn ghost',style:'margin-top:18px',onclick:()=>mailSupport(title)},'Email '+HELP_EMAIL):null);
  const pg=h('div',{class:'spage docpage',style:'z-index:60'},
    h('div',{class:'sph'},h('button',{class:'icon-btn','aria-label':'Back',onclick:()=>pg.remove()},svg('back')),h('h2',{},title)),bd);
  document.body.append(pg); pg.scrollTop=0;
}

/* Emoji art: Microsoft Fluent Emoji (MIT) via LobeHub CDN. Animated version first, then Fluent 3D, then Apple/Twemoji as a last resort. */
const FL_ANIM=new Map(), FL_NOANIM=new Set(), FL_STATIC=new Map();
function webpDur(buf){                       // total length of one loop of an animated WebP (ms), 0 if not animated
  try{ const d=new DataView(buf); if(d.byteLength<30||d.getUint32(0)!==0x52494646) return 0;
    let p=12,t=0,n=0; while(p+8<=d.byteLength){ const id=d.getUint32(p), sz=d.getUint32(p+4,true);
      if(id===0x414E4D46){ t+=(d.getUint8(p+20)|(d.getUint8(p+21)<<8)|(d.getUint8(p+22)<<16)); n++; }
      p+=8+sz+(sz&1); }
    return n>1?Math.max(t,200):0; }catch(_){ return 0; }
}
let animQ=0; const animWait=[];
function animSlot(){ return new Promise(res=>{ const go=()=>{ animQ++; res(()=>{ animQ--; const n=animWait.shift(); if(n) n(); }); }; animQ<3?go():animWait.push(go); }); }
async function loadAnimEmoji(names){
  const rel=await animSlot();
  try{
    const rs=await Promise.all(names.map(async c=>{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),8000);
      try{ const r=await fetch('https://cdn.jsdelivr.net/gh/lobehub/fluent-emoji/packages/anim/assets/'+c+'.webp',{signal:ctl.signal,cache:'force-cache'}); if(!r.ok) return null;
        const buf=await r.arrayBuffer(), dur=webpDur(buf); return dur?{buf,dur,still:null}:null; }catch(_){ return null; }
      finally{ clearTimeout(t); }
    }));
    return rs.find(Boolean)||null;
  } finally{ rel(); }
}
/* Emoji art: Microsoft Fluent Emoji (MIT) via LobeHub CDN. The animation plays ONCE (when the message is shown) and then rests on a still frame; tap a big emoji to play it again. */
function animEmoji(e,size){
  const txt=()=>h('span',{style:`font-size:${Math.round(size*.82)}px;line-height:1;display:inline-block`},e);
  if(!PREF.get('fx')) return txt();
  const cp=Array.from(e).map(c=>c.codePointAt(0).toString(16).padStart(4,'0')), full=cp.join('-'), strip=cp.filter(x=>x!=='fe0f').join('-');
  const names=[strip]; if(full!==strip) names.push(full);
  const F3=c=>'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/'+c+'.webp';
  const A=c=>'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/'+c+'.png';
  const T=c=>'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/'+c.replace(/-fe0f/g,'')+'.svg';
  const big=size>=60;
  const im=h('img',{class:'ae ae-in'+(big?' tap':''),alt:e,draggable:'false',referrerpolicy:'no-referrer',style:'--s:'+size+'px'});
  const springAgain=()=>{ im.classList.remove('ae-in'); void im.offsetWidth; im.classList.add('ae-in'); };
  const staticArt=()=>{                       // no animated version: still Fluent 3D (then Apple / Twemoji), spring-in once
    const list=[...names.map(F3),...names.map(A),T(full)], k=FL_STATIC.get(e); let i=0; if(k){ const j=list.indexOf(k); if(j>0) i=j; }
    im.onerror=()=>{ i++; if(i<list.length) im.src=list[i]; else if(im.parentNode) im.replaceWith(txt()); };
    im.onload=()=>{ FL_STATIC.set(e,list[i]); }; if(big) im.onclick=springAgain; im.src=list[i];
  };
  const showAnim=rec=>{
    let cur=null, timer=null;
    const play=()=>{ clearTimeout(timer); const old=cur; cur=URL.createObjectURL(new Blob([rec.buf],{type:'image/webp'})); im.src=cur; if(old) URL.revokeObjectURL(old);
      timer=setTimeout(()=>{ if(rec.still) im.src=rec.still; },rec.dur+60); };
    im.onload=()=>{ if(rec.still||!/^blob:/.test(im.src)) return;
      try{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); rec.still=c.toDataURL('image/png'); }catch(_){} };
    im.onerror=()=>{ im.onerror=null; staticArt(); };
    if(big) im.onclick=()=>{ play(); springAgain(); };
    play();
  };
  const hit=FL_ANIM.get(e);
  if(hit){ showAnim(hit); return im; }
  staticArt();                                  // a small still image appears straight away...
  if(size>=40 && window.fetch && !FL_NOANIM.has(e))   // ...and the animation (bigger file) swaps in when it has downloaded
    loadAnimEmoji(names).then(rec=>{
      if(!rec){ FL_NOANIM.add(e); return; }
      FL_ANIM.set(e,rec); if(FL_ANIM.size>40) FL_ANIM.delete(FL_ANIM.keys().next().value);
      if(im.parentNode) showAnim(rec);
    });
  return im;
}

let fxRun=null;
function playScreenFx(kind){
  if(!PREF.get('fx')) return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif', rnd=(a,b)=>a+Math.random()*(b-a);
  const COL=['#3B82F6','#F43F5E','#F59E0B','#10B981','#8B5CF6','#EC4899','#FACC15'];
  const DUR=kind==='confetti'?3.6:3.4; let P=[];

    P.forEach((p,i)=>{ const left=i%2===0; p.vx=(left?1:-1)*rnd(4,13); p.vy=-rnd(13,26); });
  } else if(kind==='balloons'){
    for(let i=0;i<22;i++) P.push({x:rnd(10,W-40),y:H+rnd(40,320),vy:-rnd(2.2,4.4),s:rnd(44,80),ph:rnd(0,6),sw:rnd(.6,1.6),e:'🎈'});
  } else if(kind==='hearts'){
    const HE=['❤️','💖','💕','💗','🩷']; for(let i=0;i<34;i++) P.push({x:rnd(10,W-30),y:H+rnd(20,420),vy:-rnd(1.8,3.8),s:rnd(26,58),ph:rnd(0,6),sw:rnd(.5,1.4),e:HE[i%HE.length]});
  } else { for(let i=0;i<60;i++) P.push({x:rnd(0,W),y:rnd(0,H),s:rnd(18,44),ph:rnd(0,6),sp:rnd(2,5),e:'✨',d:rnd(0,1.6)}); }

/* =====================================================================
   Multi-device history sync (still end-to-end encrypted)
   An existing device — after the owner taps "Allow" — re-wraps the message
   key of each message for the NEW device's public key and stores only that
   wrapped key under histKeys/<uid>/<newDevId>. The server never sees plaintext
   or raw keys; only the new device's private key can open them.
   ===================================================================== */
let histMap={}, hsAsked=new Set(), hsTimer=null, hrT=null, hsBusy=false;

// "Later" / dismissed -> don't ask again for 3 days (survives reloads)
const HS_SNOOZE=3*24*3600*1000;
const hsSnoozed=id=>{ const key='hslater:'+me.uid+':'+id; let t=hsMem[key]||0; try{ t=Math.max(t,+localStorage.getItem(key)||0); }catch(_){} return Date.now()-t<HS_SNOOZE; };

async function histUnwrap(cid,key){
  const w=(histMap[cid]||{})[key]; if(!w||!dev) return null;
  try{
    const pub=await senderPub(me.uid,w.fd); if(!pub) return null;
    const sk=await wrapKeyFor(dev.priv,pub);
    const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.i)},sk,unb64(w.c));
    return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['decrypt']);
  }catch(_){ return null; }
}
async function reprocessHist(){
  let touched=false;
  for(const [uid,t] of Object.entries(threads)){
    const hm=histMap[chatCid(uid)]; if(!hm) continue;
    const redo=t.items.filter(i=>i.locked&&hm[i.key]); if(!redo.length) continue;
    t.items=t.items.filter(i=>!redo.includes(i));
    for(const i of redo){ try{ await onMsg(uid,i.key,i.rec); }catch(e){ console.warn(e); } }
    t.last=t.items[t.items.length-1]||null; touched=true;
    if(openUid===uid) renderChat();
  }
  if(touched){ renderList(); toast('Older messages synced from your other device'); }
}
const hsItems=t=>[...t.items,...(t.hid||[])];
function hsNeeds(did){
  let n=0; for(const t of Object.values(threads)) for(const it of hsItems(t)) if(it.mk&&!it.locked&&!it.unsent&&it.rec&&it.rec.k&&!it.rec.k[did]) n++;

async function syncHistory(){
  if(!me||!dev||hsBusy) return; hsBusy=true;
  try{
    const others=Object.entries(devCache[me.uid]||{}).filter(([id])=>id!==dev.id&&hsFlag('ok',id));
    for(const [did,pub] of others){
      const dk='hsdone:'+me.uid+':'+did; let done; try{ done=new Set(JSON.parse(localStorage.getItem(dk)||'[]')); }catch(_){ done=new Set(); }
      const upd={}, added=[];
      for(const [uid,t] of Object.entries(threads)){
        const cid=chatCid(uid);
        for(const it of hsItems(t)){
          if(!it.mk||it.locked||it.unsent||!it.rec||(it.rec.k&&it.rec.k[did])||done.has(it.key)) continue;

async function checkNewDevices(){

    if(id===dev.id||hsFlag('ok',id)||hsFlag('no',id)||hsSnoozed(id)||hsAsked.has(id)) continue;

function linkify(text){
  const out=[]; let last=0; const re=/https?:\/\/[^\s<>"']+/gi; let m;
  while((m=re.exec(String(text)))){
    let raw=m[0], trail=''; const t=raw.match(/[).,!?;:]+$/); if(t){ trail=t[0]; raw=raw.slice(0,-trail.length); }
    const href=safeHttp(raw); if(!href) continue;
    if(m.index>last) out.push(String(text).slice(last,m.index));
    out.push(h('a',{class:'ln',href,target:'_blank',rel:'noopener noreferrer'},raw)); if(trail) out.push(trail);
    last=m.index+m[0].length;
  }
  if(last<String(text).length) out.push(String(text).slice(last)); return out;
}
function lpCard(lp){

  a.append(h('div',{class:'lpt'},h('b',{},String(lp.t||href).slice(0,120)),h('small',{},String(lp.s||'').slice(0,60)))); return a;
}

function locView(p){

  const z=15, n=Math.pow(2,z), W=240, H=150, rad=lat*Math.PI/180;
  const px=(lng+180)/360*n*256, py=(1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n*256, left=px-W/2, top=py-H/2;
  const map=h('div',{class:'map'});
  for(let tx=Math.floor(left/256);tx<=Math.floor((left+W)/256);tx++) for(let ty=Math.floor(top/256);ty<=Math.floor((top+H)/256);ty++){
    if(ty<0||ty>=n) continue; const wx=((tx%n)+n)%n;
    map.append(h('img',{src:'https://tile.openstreetmap.org/'+z+'/'+wx+'/'+ty+'.png',alt:'',loading:'lazy',draggable:'false',style:'left:'+Math.round(tx*256-left)+'px;top:'+Math.round(ty*256-top)+'px'}));

}
