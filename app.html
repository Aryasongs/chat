async function submitReport(uid, reason, details, withEvidence, alsoBlock){
  const day = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const rid = me.uid+'_'+uid+'_'+day;                       // one report per person per day
  const ev = [];
  if(withEvidence){
    (threads[uid]?.items||[]).filter(i=>!i.locked && i.p).slice(-10).forEach(i=>{
      const p=i.p;
      ev.push({ who:i.from===me.uid?'reporter':'reported', t:String(p.t||'text').slice(0,10),
        text: p.t==='text' ? String(p.text).slice(0,500) : (p.t==='img' ? '[photo]' : p.t==='gif' ? '[gif]' : '[voice message]'), ts:i.ts });
    });
  }
  const rec = { by:me.uid, against:uid, cid:cidOf(me.uid,uid), reason, ts:TS, status:'open' };
  if(details) rec.details = details.slice(0,600);
  if(ev.length) rec.evidence = ev;
  await R('reports/'+rid).set(rec);
  if(alsoBlock){ try{ await R('blocks/'+me.uid+'/'+uid).set(TS); }catch(e){} }
}

async function modAct(against, ids, action, note){

    const m={ status: action==='warn'?'warned' : action==='ban'?'banned' : 'suspended', reason:note||'', by:me.uid, ts:TS };

    upd['moderation/'+against]=m;

    upd['reports/'+id+'/action']=action; upd['reports/'+id+'/resolvedBy']=me.uid; upd['reports/'+id+'/resolvedAt']=TS;

}

      try{ const pl={t:'text',text:t,bg:P.bg,font:P.font,al:P.al,col:P.col}; if(P.sz) pl.sz=P.sz; if(P.b) pl.b=1; if(P.i) pl.i=1; if(P.box) pl.box=1; if(P.caps) pl.caps=1;

      catch(e){ console.warn(e); toast('Could not post story. Check your connection.'); send.disabled=false; send.classList.remove('busy'); } };

  }

  /* =============================== VIEWER =============================== */
  function view(uids,startUid){
    let ui=Math.max(0,uids.indexOf(startUid)), ii=0, timer=null, raf=0, curVid=null, paused=false, el=0, dur=5000, token=0, held=null;
    const root=h('div',{class:'stvw'}), bars=h('div',{class:'stvbars'}), head=h('div',{class:'stvhead'}), stageEl=h('div',{class:'stvstage'}), foot=h('div',{class:'stvfoot'});
    root.append(stageEl,h('div',{class:'stvgrad top'}),bars,head,foot); document.body.append(root); document.body.classList.add('stopen');
    const close=()=>{ clearInterval(timer); cancelAnimationFrame(raf); if(curVid){ try{ curVid.pause(); }catch(_){} curVid=null; } root.remove(); document.body.classList.remove('stopen'); refresh(); };
    const list=u=>S.items[u]||[];
    function seek(delta){
      ii+=delta;
      while(true){
        if(ii<0){ if(ui>0){ ui--; ii=Math.max(0,list(uids[ui]).length-1); continue; } ii=0; break; }
        if(ii>=list(uids[ui]).length){ if(ui<uids.length-1){ ui++; ii=0; continue; } return close(); }
        break;
      }
      show();
    }
    async function show(){
      const u=uids[ui], arr=list(u), it=arr[ii]; if(!it) return close();
      const my=++token; el=0; paused=false; clearInterval(timer); cancelAnimationFrame(raf); if(curVid){ try{ curVid.pause(); }catch(_){} curVid=null; }
      const c0=contacts[u]||(u===me.uid?myProf:null)||{name:'Unknown'}, own=u===me.uid;
      bars.replaceChildren(...arr.map((_,i)=>h('div',{class:'stvbar'},h('i',{style:'transform:scaleX('+(i<ii?1:0)+')'}))));
      head.replaceChildren(...[h('button',{class:'stvx',onclick:close,'aria-label':'Close'},svg('back')),avatar(c0,40,false),h('div',{class:'stvwho'},h('b',{},own?'My story':c0.name),h('small',{},ago(it.ts))),
        own?h('button',{class:'stvx',onclick:()=>{ paused=true; modal(h('div',{class:'sheet'},h('h2',{},'Delete this story?'),h('button',{class:'btn',style:'background:#E5484D',onclick:async()=>{ closeModal(); await del(it.key); close(); }},'Delete'),h('button',{class:'btn ghost',style:'margin-top:10px',onclick:()=>{ closeModal(); paused=false; }},'Cancel'))); document.querySelector('#modalRoot .modal').style.zIndex=95; },'aria-label':'Delete'},svg('trash')):null].filter(Boolean));
      stageEl.replaceChildren(h('div',{class:'stvload'},'Loading…')); foot.replaceChildren();
      let c; try{ c=await open(u,it); }catch(e){ if(my!==token) return; stageEl.replaceChildren(h('div',{class:'stvload'},'🔒 This story can’t be opened on this device')); dur=3000; run(my,u,it); return; }
      if(my!==token) return;
      if(c.p.t==='text'){
        const len=String(c.p.text).length, t=h('div',{class:'stvtext'},c.p.text); txApply(t,c.p,len); if(c.p.box) t.style.width='100%';
        stageEl.replaceChildren(h('div',{class:'stvtx',style:'background:'+bgCss(c.p.bg||0)},t)); txFit(t,stageEl.clientHeight-210); dur=txDur(len); run(my,u,it);
      }else{
        let url; try{ url=await media(u,it,c); }catch(e){ if(my!==token) return; stageEl.replaceChildren(h('div',{class:'stvload'},'This story is no longer available')); dur=3000; run(my,u,it); return; }
        if(my!==token) return;
        if(c.p.t==='vid'){
          const v=h('video',{class:'stvimg',src:url}); v.playsInline=true; v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline',''); v.preload='auto'; v.controls=false; v.style.pointerEvents='none';
          dur=Math.min(VID_MAX_S,c.p.dur||VID_MAX_S)*1000+400; v.onloadedmetadata=()=>{ if(isFinite(v.duration)&&v.duration>0) dur=Math.min(VID_MAX_S*1000,v.duration*1000); };
          v.onended=()=>{ el=dur; }; curVid=v; stageEl.replaceChildren(v);
          const go=v.play(); if(go&&go.catch) go.catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
        }else{ const im=h('img',{class:'stvimg',src:url,draggable:'false'}); stageEl.replaceChildren(im); dur=5000; }
        if(c.p.cap) foot.append(h('div',{class:'stvcap'},c.p.cap));
        run(my,u,it);
      }
      // footer: own = views, others = reply
      if(own){
        const vb=h('button',{class:'stvviews',onclick:async()=>{ paused=true; const s=await R('statusViews/'+me.uid+'/'+it.key).once('value'); const v=s.val()||{}; const rows=Object.keys(v).sort((a,b)=>v[b]-v[a]).map(vu=>{ const c=contacts[vu]||{name:'Someone',uid:vu}; return h('div',{class:'item'},avatar(c,36,false),h('span',{style:'flex:1'},c.name),h('small',{style:'color:var(--muted)'},ago(v[vu]))); });
          modal(h('div',{class:'sheet'},h('h2',{},'Viewed by '+rows.length),rows.length?rows:h('p',{style:'color:var(--muted)'},'No views yet'),h('button',{class:'btn ghost',style:'margin-top:12px',onclick:()=>{ closeModal(); paused=false; }},'Close'))); document.querySelector('#modalRoot .modal').style.zIndex=95; }},svg('eyeo'),h('span',{},'…'));
        foot.append(vb); R('statusViews/'+me.uid+'/'+it.key).once('value').then(s=>{ const n=Object.keys(s.val()||{}).length; const sp=vb.querySelector('span'); if(sp) sp.textContent=n; }).catch(()=>{});
      }else{
        const inp=h('input',{class:'stvreply',placeholder:'Reply…',maxlength:'500'}); inp.onfocus=()=>{ paused=true; }; inp.onblur=()=>{ paused=false; };
        const sb=h('button',{class:'stvrs','aria-label':'Send reply',onclick:async()=>{ const t=inp.value.trim(); if(!t) return; inp.value=''; inp.blur(); try{ await sendPayload(u,{t:'text',text:'↩️ Story reply: '+t}); toast('Reply sent'); }catch(_){ toast('Could not send'); } }},svg('send'));
        inp.onkeydown=e=>{ if(e.key==='Enter') sb.onclick(); }; foot.append(h('div',{class:'stvrw'},inp,sb));
        markSeenLocal(it.key); dot(); if(PREF.get('rr')) R('statusViews/'+u+'/'+it.key+'/'+me.uid).set(TS).catch(()=>{});
      }
    }
    function run(my,u,it){
      clearInterval(timer); cancelAnimationFrame(raf); const f=bars.querySelectorAll('.stvbar i')[ii]; let last=performance.now();
      const step=now=>{ if(my!==token) return; const dt=Math.min(100,now-last); last=now; if(curVid){ if(paused){ if(!curVid.paused) curVid.pause(); } else if(curVid.paused&&!curVid.ended&&curVid.readyState>2) curVid.play().catch(()=>{}); }
        if(!paused&&!(curVid&&curVid.readyState<3&&!curVid.ended)) el+=dt; if(f) f.style.transform='scaleX('+Math.min(1,el/dur)+')'; if(el>=dur){ seek(1); return; } raf=requestAnimationFrame(step); };
      raf=requestAnimationFrame(step);
    }
    /* gestures */
    stageEl.addEventListener('pointerdown',e=>{ held={x:e.clientX,y:e.clientY,t:Date.now(),hold:setTimeout(()=>{ paused=true; root.classList.add('hold'); },220)}; });
    const end=e=>{ if(!held) return; clearTimeout(held.hold); const wasHold=root.classList.contains('hold'); root.classList.remove('hold'); const dx=e.clientX-held.x, dy=e.clientY-held.y; const h0=held; held=null;
      if(dy>90&&Math.abs(dx)<80) return close(); paused=false; if(wasHold||Math.hypot(dx,dy)>12) return;
      const r=stageEl.getBoundingClientRect(); if(e.clientX-r.left<r.width*.33) seek(-1); else seek(1); };
    stageEl.addEventListener('pointerup',end); stageEl.addEventListener('pointercancel',()=>{ if(held){ clearTimeout(held.hold); held=null; root.classList.remove('hold'); paused=false; } });
    document.addEventListener('keydown',function k(e){ if(!root.isConnected){ document.removeEventListener('keydown',k); return; } if(e.key==='Escape') close(); else if(e.key==='ArrowRight') seek(1); else if(e.key==='ArrowLeft') seek(-1); });
    // start at first unseen item of the starting contact
    const seen=getSeen(); const a0=list(uids[ui]); const fi=a0.findIndex(i=>!seen[i.key]); ii=(uids[ui]===me.uid||fi<0)?0:fi; show();
  }

  return { watch, init, reset, render, dot, post, pick, textStatus, view, edit:editor };
})();
try{ icon(document.querySelector('.nav button[data-tab="updates"]'),'status'); }catch(_){}

if(!firebaseConfig.apiKey) document.body.textContent='Missing Firebase config';
/* ---------------- instant start: show last known chat list before Firebase answers ---------------- */
function seedGhosts(sn){
  (sn.contacts||[]).forEach(g=>{
    if(!g||!g.uid||contacts[g.uid]) return;
    const c={uid:g.uid,name:g.name||'Chat',pname:g.pname,photo:g.photo||null,uidNum:g.uidNum||'',about:g.about||'',isGroup:!!g.isGroup,verified:!!g.verified,bot:!!g.bot,members:g.members||{},ghost:true};
    if(g.links) c.links=g.links;
    if(g.uid===KAI_UID){ c.photo=KAI_LOGO; c.verified=true; c.bot=true; }
    if(g.uid===MONTE_UID){ c.photo=MONTE_LOGO; c.verified=true; c.bot=true; }
    contacts[g.uid]=c;
    const last=g.lts?{ts:g.lts,from:'ghost',gpv:g.pv||'',p:null,key:'ghost'}:null;
    threads[g.uid]=threads[g.uid]||{items:[],last,unread:g.unread||0,chain:Promise.resolve(),votes:{},ghostLast:last,ghostUnread:g.unread||0};
  });
}
function clearGhostLasts(){
  if(!me) return;
  Object.keys(threads).forEach(u=>{
    const t=threads[u]; if(!t||!t.ghostLast) return;
    t.ghostLast=null; t.last=t.items[t.items.length-1]||null;
    const lr=getLR(u); t.unread=t.items.filter(i=>i.from!==me.uid&&i.ts>lr).length;
  });
  renderList();
}
function snapSoon(){ if(!me||!appReady) return; clearTimeout(snapT); snapT=setTimeout(saveSnap,1500); }
function saveSnap(){
  try{
    if(!me||!appReady||!myProf) return;
    const out=Object.values(contacts).filter(c=>c&&c.uid).map(c=>{
      const t=threads[c.uid]||{}, l=t.last;
      return {uid:c.uid,name:c.name,pname:c.pname,photo:c.bot?null:(c.photo||null),uidNum:c.uidNum||'',about:c.about||'',isGroup:!!c.isGroup,verified:!!c.verified,bot:!!c.bot,links:c.links||null,
        members:c.isGroup?Object.fromEntries(Object.entries(c.members||{}).map(([u,m])=>[u,{r:(m&&m.r)||'m'}])):null,
        lts:l?l.ts:0, pv:l?previewOf(l,c.uid):'', unread:t.unread||0};
    });
    idbSet('snap:last',{uid:me.uid,email:me.email||'',prof:{name:myProf.name,photo:myProf.photo||null,uidNum:myProf.uidNum,about:myProf.about||''},contacts:out,ts:Date.now()}).catch(()=>{});
  }catch(e){ console.warn('snap',e); }
}
async function bootFromCache(){
  try{
    const sn=await idbGet('snap:last');
    if(!sn||!sn.uid||!Array.isArray(sn.contacts)||!sn.contacts.length||me) return;
    bootSnap=sn;
    me={uid:sn.uid,email:sn.email||''}; myProf=sn.prof?{uid:sn.uid,...sn.prof}:null;
    seedGhosts(sn);
    show('appStage'); setTab('chats'); renderChat();
  }catch(e){ console.warn('boot cache',e); }
}
bootP=bootFromCache();
