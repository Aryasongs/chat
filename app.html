<style>
:root{
  --bg:#E6EEFA; --card:#fff; --navy:#2D2A5E; --ink:#3A3860; --muted:#8C90A8; --soft:#F3F4FC;
  --blue:#3B82F6; --blue-d:#2F6FE0; --line:#EDEFF7; --danger:#E5484D;
  --head:'Poppins','Inter',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1424;--card:#171D30;--navy:#ECEEFB;--ink:#D8DBF0;--muted:#8A90AD;--soft:#222a42;--line:#262E48}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px}
.phone{width:min(475px,100%);height:min(990px,calc(100vh - 64px));background:var(--card);border-radius:56px;box-shadow:0 30px 70px rgba(70,100,170,.10);position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ---------- left: list card ---------- */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 32px}
.panel-top{display:flex;align-items:center;justify-content:space-between;padding-top:82px;margin-bottom:18px}
.panel-top h1{font:600 40px/1.1 var(--head);color:var(--navy);margin:0;letter-spacing:-.3px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.icon-btn:hover{background:var(--soft)}
.searchbar{margin:0 0 6px;display:none}
.searchbar.on{display:block}
.searchbar input{width:100%;height:44px;border:0;border-radius:22px;background:var(--soft);padding:0 18px;outline:none}
.scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -32px;padding:0 32px 90px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;cursor:pointer;width:100%;text-align:left}
.row .body{flex:1;min-width:0}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row .name{font:500 18px/1.3 var(--head);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:15px;color:var(--muted);white-space:nowrap}
.row .prev{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px}
.row .txt{color:var(--muted);font-size:16px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.badge{min-width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;font:600 15px/32px var(--body);text-align:center;padding:0 8px;flex:none}
.row.active .name{color:var(--blue)}
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 20px var(--head);aspect-ratio:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%;display:block}
.av .dot{position:absolute;right:1%;bottom:1%;width:22%;max-width:20px;min-width:12px;aspect-ratio:1;border-radius:50%;background:var(--blue);border:3px solid var(--card)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.6;font-size:15px}
.empty b{display:block;color:var(--navy);font:600 18px var(--head);margin-bottom:6px}

.fab{position:absolute;right:30px;bottom:132px;width:80px;height:80px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(59,130,246,.45);z-index:3;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:34px;height:34px;stroke-width:1.6}

.nav{height:112px;flex:none;display:flex;justify-content:space-around;align-items:center;padding:0 38px 6px;background:var(--card)}
.nav button{position:relative;width:48px;height:48px;display:grid;place-items:center;color:#9CA0B8}
.nav button.on{color:var(--navy)}
.nav button.on::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--navy)}
.nav svg{width:30px;height:30px}

/* settings / contacts */
.sec{margin-bottom:22px}
.sec h3{font:500 13px var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 10px}
.me-card{display:flex;gap:16px;align-items:center;padding:6px 0 18px}
.me-card .n{font:600 22px var(--head);color:var(--navy)}
.me-card .e{color:var(--muted);font-size:14px;word-break:break-all}
.uidbox{background:var(--soft);border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.uidbox small{display:block;color:var(--muted);font-size:12px}
.uidbox b{font:600 24px var(--head);color:var(--navy);letter-spacing:1.5px}
.item{display:flex;align-items:center;gap:14px;padding:14px 4px;width:100%;text-align:left;color:var(--navy);font-weight:500;border-bottom:1px solid var(--line)}
.item svg{color:var(--muted)}
.item .sub{display:block;color:var(--muted);font-weight:400;font-size:13px}
.item.danger{color:var(--danger)}.item.danger svg{color:var(--danger)}
.note{background:var(--soft);border-radius:18px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.55;display:flex;gap:10px}
.note svg{width:20px;height:20px;color:var(--blue);margin-top:1px}

/* ---------- right: chat card ---------- */
.chat-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;line-height:1.6}
.chat-empty .lk{width:84px;height:84px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 18px;color:var(--blue)}
.chat-empty .lk svg{width:38px;height:38px}
.chat-empty b{display:block;color:var(--navy);font:600 20px var(--head);margin-bottom:4px}
.chead{padding:56px 32px 0;display:grid;grid-template-columns:48px 1fr 48px;align-items:start;flex:none}
.chead .mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.chead .mid .nm{font:500 19px var(--head);color:var(--navy);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .icon-btn{color:var(--navy);margin-top:18px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:26px 32px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.e2e{align-self:center;background:var(--soft);color:var(--muted);font-size:12px;padding:7px 14px;border-radius:14px;display:flex;gap:6px;align-items:center;text-align:center;margin-bottom:10px;max-width:92%}
.e2e svg{width:14px;height:14px;flex:none}
.day{align-self:center;color:var(--muted);font-size:12px;margin:8px 0}
.m{display:flex;flex-direction:column;max-width:86%;margin-top:6px}
.m.me{align-self:flex-end;align-items:flex-end}
.m.them{align-self:flex-start;align-items:flex-start}
.bub{padding:16px 30px 16px 30px;font-size:17px;line-height:1.45;word-break:break-word;white-space:pre-wrap;border-radius:32px}
.m.me .bub{background:var(--blue);color:#fff;border-bottom-right-radius:0}
.m.them .bub{background:var(--soft);color:var(--ink);border-bottom-left-radius:0}
.m .ts{font-size:15px;color:var(--muted);margin-top:7px}
.m.sticker .bub{background:none!important;padding:0;font-size:96px;line-height:1.1}
.m.img .bub{padding:4px;border-radius:24px}
.m.img.me .bub{border-bottom-right-radius:0}.m.img.them .bub{border-bottom-left-radius:0}
.bub img{display:block;max-width:100%;max-height:300px;border-radius:20px;cursor:zoom-in}
.m.locked .bub{font-style:italic;opacity:.8}
.voice{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 22px;min-width:250px}
.m.voicem .bub{padding:0}
.wave{display:flex;align-items:center;gap:2px;height:44px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:#C9CBD8;min-height:3px}
.wave i.p{background:var(--blue)}
.m.me .wave i{background:rgba(255,255,255,.45)}.m.me .wave i.p{background:#fff}
.vdur{font-size:16px;color:var(--navy);min-width:42px}
.m.me .vdur{color:#fff}
.play{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.m.me .play{background:#fff;color:var(--blue)}
.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.typing{height:30px;padding:0 32px;color:var(--muted);font-size:16px;display:flex;align-items:center;gap:6px;flex:none}
.typing .d{display:inline-flex;gap:3px}
.typing .d i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing .d i:nth-child(2){animation-delay:.2s}.typing .d i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.composer{padding:8px 32px 38px;flex:none;position:relative}
.pill{height:76px;border-radius:38px;background:var(--soft);display:flex;align-items:center;gap:14px;padding:0 20px 0 14px}
.plus{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s}
.plus.open{transform:rotate(45deg)}
.plus svg{width:26px;height:26px;stroke-width:2.2}
.pill input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:18px;color:var(--navy)}
.pill input::placeholder{color:#9A9EB8}
.pill .em{color:var(--blue);width:36px;height:36px;display:grid;place-items:center}
.pill .em svg{width:32px;height:32px;stroke-width:1.5}
.sendb{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.sendb{-webkit-appearance:none;appearance:none;border:0;outline:none;-webkit-tap-highlight-color:transparent}
.sendb:focus,.sendb:focus-visible,.sendb:active{outline:none;box-shadow:none;border:0}
.sendb svg{width:22px;height:22px;pointer-events:none}
.menu{position:absolute;left:32px;bottom:122px;background:var(--card);border-radius:22px;box-shadow:0 14px 40px rgba(40,60,120,.18);padding:8px;z-index:5;min-width:190px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;color:var(--navy);font-weight:500}
.menu button:hover{background:var(--soft)}
.menu svg{color:var(--blue)}
.emoji{position:absolute;left:20px;right:20px;bottom:104px;background:var(--card);border-radius:24px;box-shadow:0 14px 40px rgba(40,60,120,.22);z-index:5;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line,#E4E7F5)}
.emoji .etabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line,#E4E7F5)}
.emoji .etabs button{flex:1;height:38px;font-size:20px;border-radius:10px 10px 0 0;opacity:.55;position:relative}
.emoji .etabs button.on{opacity:1}
.emoji .etabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:3px;border-radius:3px;background:var(--blue)}
.emoji .elabel{padding:10px 16px 2px;font:600 12px var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.emoji .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));padding:6px 10px 12px;height:210px;overflow-y:auto;align-content:start}
.emoji .egrid button{font-size:26px;height:42px;border-radius:12px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.emoji .egrid button:hover,.emoji .egrid button:active{background:var(--soft)}
.emoji .eempty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.gifp{position:absolute;left:20px;right:20px;bottom:104px;background:var(--card);border-radius:24px;box-shadow:0 14px 40px rgba(40,60,120,.22);z-index:5;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);padding:12px 12px 8px}
.gifp .gs{width:100%;height:42px;border:0;border-radius:21px;background:var(--soft);padding:0 16px;outline:none;color:var(--ink);font-size:16px;margin-bottom:10px}
.gifp .gg{column-count:2;column-gap:8px;height:300px;overflow-y:auto}
.gifp .gi{break-inside:avoid;margin-bottom:8px;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--soft)}
.gifp .gi:active{transform:scale(.96)}
.gifp .gi img{display:block;width:100%;height:auto}
.gifp .ge{column-span:all;text-align:center;color:var(--muted);padding:40px 12px;font-size:14px}
.gifp .gp{text-align:center;font-size:11px;color:var(--muted);padding-top:6px}
.bub img.gifimg{cursor:default;max-width:240px;min-width:120px;background:rgba(127,127,127,.15)}
/* no pinch / double-tap zoom */
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* chat wallpaper */
.msgs.wp .day,.msgs.wp .e2e{background:color-mix(in srgb,var(--card) 80%,transparent);padding:4px 12px;border-radius:12px}
.msgs.wp .m .ts{display:inline-block;background:color-mix(in srgb,var(--card) 80%,transparent);padding:2px 9px;border-radius:10px;font-size:12px;margin-top:4px}
.wpseg{display:flex;background:var(--soft);border-radius:14px;padding:3px;margin:10px 0 14px}
.wpseg button{flex:1;height:36px;border-radius:11px;color:var(--muted);font-weight:500;font-size:14px}
.wpseg button.on{background:var(--card);color:var(--navy);box-shadow:0 2px 8px rgba(40,60,120,.12)}
.wpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.wpgrid button{aspect-ratio:3/4;border-radius:14px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(127,127,127,.2);font-size:12px;color:var(--muted);display:grid;place-items:center;background-size:cover;background-position:center}
.wpgrid button.sel{border-color:var(--blue)}
.wpgrid button.def{background-color:var(--soft)}
.wpgrid button svg{width:22px;height:22px}
.chk{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin:0 6px 14px}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.chead .mid{cursor:pointer}
/* contact profile (iMessage-style, minimal) */
.ci{position:absolute;inset:0;background:var(--card);z-index:8;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}
.ci::-webkit-scrollbar{display:none}
.ci-top{padding:56px 26px 0;display:flex;justify-content:flex-end;flex:none}
.ci-top button{color:var(--blue);font-weight:500;font-size:17px}
.ci{overflow-y:auto!important;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;min-height:0;padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 24px))!important}
.ci>*{flex-shrink:0}
.ci-top{position:sticky;top:0;z-index:2;background:var(--card);padding-bottom:6px}
.ci-hero{display:flex;flex-direction:column;align-items:center;padding:6px 24px 0;text-align:center}
.ci-hero .av{cursor:zoom-in}
.ci-hero h2{font:600 28px var(--head);color:var(--navy);margin:16px 0 2px;letter-spacing:-.3px;word-break:break-word}
.ci-hero .st{color:var(--muted);font-size:14.5px;min-height:20px}
.ci-acts{display:flex;gap:10px;padding:22px 24px 4px}
.ci-acts button{flex:1;background:var(--soft);border-radius:16px;padding:13px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--blue);font-size:12px;font-weight:500}
.ci-acts button svg{width:22px;height:22px;color:var(--blue)}
.ci-acts button.dg,.ci-acts button.dg svg{color:var(--danger)}
.ci-group{background:var(--soft);border-radius:18px;margin:14px 24px 0;overflow:hidden}
.ci-row{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.ci-row:last-child{border-bottom:0}
.ci-row small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.ci-row span{color:var(--navy);font-size:16px;word-break:break-word;white-space:pre-wrap}
.ci-row.ic{display:flex;align-items:center;gap:12px;color:var(--navy);font-size:15px}
.ci-row.ic svg{width:20px;height:20px;color:var(--muted);flex:none}
.ci-row.dg,.ci-row.dg svg{color:var(--danger)}
.ci-h{margin:20px 30px 8px;font:500 12.5px var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.ci-media{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.ci-media>div{aspect-ratio:1;background:rgba(127,127,127,.15);border-radius:8px;overflow:hidden;cursor:pointer}
.ci-media img{width:100%;height:100%;object-fit:cover;display:block}
.in{width:100%;height:54px;border-radius:27px;border:2px solid transparent;background:var(--soft);padding:0 22px;outline:none;font-size:16px;color:var(--navy);margin-bottom:10px}
.in:focus{border-color:var(--blue);background:var(--card)}
/* iMessage typing bubble */
.m.tbub{margin-top:6px}
.bub.tb{display:flex;gap:5px;align-items:center;padding:15px 18px;border-radius:22px;border-bottom-left-radius:6px}
.tb i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.35;animation:tbd 1.3s infinite}
.tb i:nth-child(2){animation-delay:.18s}.tb i:nth-child(3){animation-delay:.36s}
@keyframes tbd{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sn{font-size:12.5px;font-weight:600;margin:0 10px 3px}
.rcpt{align-self:flex-end;font-size:12.5px;color:var(--muted);margin:3px 4px 0;display:flex;align-items:center;gap:5px}
.rcpt .av{width:16px!important;height:16px!important;font-size:8px!important}
.sysm{align-self:center;text-align:center;color:var(--muted);font-size:12.5px;margin:8px 0;max-width:88%}
.chead .mid .gs{font-size:12.5px;color:var(--muted);margin-top:-4px}
/* switches */
.sw{position:relative;width:51px;height:31px;flex:none;display:block}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:rgba(127,127,127,.35);border-radius:16px;transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:#34C759}
.sw input:checked+span::after{transform:translateX(20px)}
/* group */
.ck2{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:#fff}
.ck2.on{background:var(--blue);border-color:var(--blue)}
.ck2.on::after{content:"✓";font-size:14px;line-height:1}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border-bottom:1px solid var(--line);text-align:left}
.mrow:last-child{border-bottom:0}
.mrow .mn{flex:1;color:var(--navy);font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm{font-size:12px;color:var(--blue);background:rgba(59,130,246,.12);padding:3px 9px;border-radius:9px;font-weight:600}
/* polls */
.m.pollb .bub,.m.me.pollb .bub{padding:14px 16px;min-width:250px;white-space:normal;background:var(--soft);color:var(--ink)}
.m.me.pollb .bub{border-bottom-right-radius:8px}
.pq{font:600 16px var(--head);margin-bottom:2px;color:var(--navy);word-break:break-word}
.pn{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.po{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--card);margin-bottom:6px;overflow:hidden;color:var(--navy);font-size:15px}
.po .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(59,130,246,.2);transition:width .3s}
.po>span{position:relative}
.po .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.po.multi .ck{border-radius:6px}
.po.on .ck{background:var(--blue);border-color:var(--blue)}
.po.on .ck::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.po .t{flex:1;word-break:break-word}
.po .c{font-size:13px;color:var(--muted)}
.pf{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.pf button{color:var(--blue);font-weight:500}
/* full-screen chat wallpaper (behind header + composer, no bezels) */
#chatCard{isolation:isolate}
.wpl{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center}
.chead,.msgs,.composer,.blockbar{position:relative;z-index:1}
.wpon .chead .nm,.wpon .chead .gs{background:color-mix(in srgb,var(--card) 78%,transparent);padding:3px 12px;border-radius:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.wpon .chead .icon-btn{background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.wpon .pill,.wpon .blockbar{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.wpblur{display:flex;align-items:center;gap:12px;margin:0 2px 14px;color:var(--muted);font-size:14px}
.wpblur b{color:var(--navy);font-weight:500;min-width:44px}
.wpblur input{flex:1;accent-color:var(--blue)}
.wpblur span{min-width:34px;text-align:right}
.rec{display:flex;align-items:center;gap:14px;width:100%}
.rec .t{flex:1;color:var(--danger);font-weight:600;display:flex;gap:8px;align-items:center}
.rec .t::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
.rec .x{color:var(--muted)}

/* ---------- auth / setup ---------- */
.solo{padding:64px 40px 40px;overflow-y:auto;flex:1;display:flex;flex-direction:column;scrollbar-width:none}
.logo{width:76px;height:76px;border-radius:26px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 0 26px;box-shadow:0 14px 30px rgba(59,130,246,.4)}
.logo svg{width:38px;height:38px;stroke-width:1.5}
.solo h1{font:600 36px/1.15 var(--head);color:var(--navy);margin:0 0 8px}
.solo p.sub{color:var(--muted);margin:0 0 26px;line-height:1.55}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 6px}
.field input,.field textarea{width:100%;height:54px;border-radius:27px;border:2px solid transparent;background:var(--soft);padding:0 22px;outline:none;font-size:16px;color:var(--navy)}
.field textarea{height:84px;padding:14px 22px;resize:none;border-radius:26px}
.field input:focus,.field textarea:focus{border-color:var(--blue);background:var(--card)}
.btn{height:56px;border-radius:28px;background:var(--blue);color:#fff;font:500 17px var(--head);width:100%;box-shadow:0 12px 24px rgba(59,130,246,.35);margin-top:6px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--soft);color:var(--navy);box-shadow:none}
.btn.line{background:none;box-shadow:none;border:2px solid var(--line);color:var(--navy)}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:2px 6px 8px}
.tabs{display:flex;background:var(--soft);border-radius:27px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;height:44px;border-radius:23px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--card);color:var(--navy);box-shadow:0 4px 14px rgba(40,60,120,.1)}
.or{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 4px}
.link{color:var(--blue);font-weight:500;font-size:14px}
.pick{display:flex;justify-content:center;margin-bottom:22px}
.pick .av{cursor:pointer}
.pick .cam{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:3px solid var(--card)}
.pick .cam svg{width:16px;height:16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,28,60,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.sheet{background:var(--card);border-radius:36px;padding:30px;width:min(420px,100%);max-height:92vh;overflow:auto}
.sheet h2{font:600 24px var(--head);color:var(--navy);margin:0 0 6px}
.sheet p{color:var(--muted);margin:0 0 18px;line-height:1.5;font-size:14.5px}
.sheet ol{color:var(--ink);line-height:1.8;padding-left:20px;font-size:14.5px;margin:0 0 14px}
.qrimg{display:grid;place-items:center;margin:8px 0}
.qrimg img{width:240px;height:240px;border-radius:18px;border:1px solid var(--line);background:#fff}
.found{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:22px;padding:14px;margin:6px 0 14px}
.found .n{font:500 17px var(--head);color:var(--navy)}.found .u{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#22264a;color:#fff;padding:13px 22px;border-radius:24px;z-index:99;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
#scan{position:fixed;inset:0;background:#000;z-index:80}
#scan video{width:100%;height:100%;object-fit:cover}
#scan .tt{position:absolute;top:0;left:0;right:0;padding:26px;color:#fff;font-weight:600;text-align:center;background:linear-gradient(#000a,transparent)}
#scan button{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:13px 30px;border-radius:30px;font-weight:600}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:grid;place-items:center;cursor:zoom-out}
#viewer img{max-width:94vw;max-height:92vh;border-radius:12px}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .stage{padding:0;gap:0;display:block;height:100dvh;min-height:0}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  body:not(.chat-open) #chatCard{display:none}
  body.chat-open #listCard{display:none}
  .panel-top{padding-top:max(46px,env(safe-area-inset-top))}
  .chead{padding-top:max(34px,env(safe-area-inset-top))}
  .nav{height:96px}
  .fab{bottom:114px;width:68px;height:68px}
}
@media (max-width:420px){
  .panel{padding:0 20px}.scroll{margin:0 -20px;padding:0 20px 90px}
  .panel-top h1{font-size:34px}
  .msgs{padding:20px 18px 8px}.composer{padding:6px 16px 22px}.chead{padding-left:18px;padding-right:18px}
  .typing{padding:0 18px}
  .bub{padding:14px 22px;font-size:16px}
  .solo{padding:48px 24px 28px}
}

/* block / report / moderation */
.blockbar{display:flex;gap:10px;justify-content:center;align-items:center;margin:0 24px 24px;padding:16px 20px;background:var(--soft);border-radius:24px;color:var(--muted);font-size:14px;flex:none}
.item.rsn{border-radius:14px;border-bottom:0;padding:11px 14px}
.item.rsn.sel{background:var(--soft);color:var(--blue);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink);margin:10px 4px;line-height:1.45}
.chk input{margin-top:3px;flex:none}
.sheet.modsheet{width:min(560px,100%)}
.modcard{background:var(--soft);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.modcard .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--navy)}
.modcard .time{font-size:13px;color:var(--muted)}
.rep{padding:10px 0;border-top:1px solid var(--line)}
.rep .rtop{display:flex;justify-content:space-between;color:var(--navy)}
.rep .rby{font-size:13px;color:var(--muted)}
.rep .rdet{font-size:14px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.evbox{background:var(--card);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.evbox .evnote{color:var(--muted);font-size:12px;margin-bottom:6px}
.evbox .ev{padding:3px 0;word-break:break-word}.evbox .ev.reported b{color:var(--danger)}
.btn.mini{height:38px;width:auto;padding:0 14px;font-size:14px;margin:8px 6px 0 0;box-shadow:none;border-radius:19px}
#modOverlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}

/* ===== keyboard fix: lock app to the visual viewport ===== */
@media (max-width:960px){
  html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
  .stage{position:fixed;left:0;right:0;top:0;transform:translate3d(var(--vvl,0px),var(--vvt,0px),0);height:var(--vvh,100dvh);min-height:0;overflow:hidden;transition:none!important}
  .phone{height:100%}
  .chead,.composer{transition:none!important}
  body.kb .composer{padding-bottom:8px}
  body.kb .chead{padding-top:max(14px,env(safe-area-inset-top))}
}

/* ===== no-zoom / fully sticky chat ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
@media (max-width:960px){
  input,textarea,select,.pill input{font-size:16px!important}
  #otpCode{font-size:22px!important}
  .pill input{font-size:17px!important}
}
@media (max-width:960px){
  html,body,.stage,.phone{overflow:hidden!important;max-width:100vw;overscroll-behavior:none}
  .stage{left:0!important;right:0!important;width:100%!important}
  .pill input{transform:translateZ(0);-webkit-user-select:text;user-select:text}
  *{-webkit-text-size-adjust:100%}
}
/* ===== mobile stability fixes ===== */
html{overflow-x:hidden;max-width:100%}
@media (max-width:960px){
  input,textarea,select{font-size:16px}
  input,textarea{-webkit-text-size-adjust:100%;text-size-adjust:100%}
}
html{-webkit-tap-highlight-color:transparent}
.msgs,.ci,#listBody,.sheet,.mo,.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (max-width:960px){
  body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
  .msgs .bub{-webkit-user-select:text;user-select:text;-webkit-touch-callout:none}
  .stage{transition:none!important}
  .phone{transform:none!important}
}
/* ===== message interactions ===== */
.m{position:relative}
.m .bub{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.m.swiping{transition:none}
.m.swback{transition:transform .2s ease}
.swr{position:absolute;left:-34px;top:50%;margin-top:-12px;opacity:0;color:var(--muted);pointer-events:none}
.m.hasrx{margin-top:20px}
.rx{position:absolute;top:-15px;display:flex;align-items:center;gap:2px;height:28px;padding:0 8px;border-radius:15px;background:var(--soft);border:2px solid var(--card);font-size:15px;line-height:1;cursor:pointer;z-index:2;white-space:nowrap;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:rxpop .22s cubic-bezier(.3,1.6,.5,1)}
.m.me .rx{left:-10px}.m.them .rx{right:-10px}
.rx.mine{background:var(--blue);color:#fff}
.rx small{font:600 12px var(--body);margin-left:1px}
@keyframes rxpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.m.unsent .bub{background:none!important;border:1.5px dashed var(--muted);color:var(--muted)!important;font-style:italic;padding:12px 22px;font-size:15px}
.fw{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);margin:0 6px 3px;font-style:italic}
.fw svg{width:14px;height:14px}
.rq{display:block;text-align:left;font-size:13px;line-height:1.35;border-left:3px solid var(--blue);border-radius:10px;padding:6px 10px;margin:0 0 8px;cursor:pointer;white-space:normal;font-style:normal;max-width:100%}
.rq b{display:block;font-weight:600;font-size:12.5px}
.rq span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85;word-break:break-word;font-size:13.5px}
.m.me .rq{background:rgba(255,255,255,.2);border-left-color:#fff;color:#fff}
.m.them .rq{background:rgba(127,127,127,.15);color:var(--ink)}
.m.img .rq{margin:6px 8px 8px}
.m.sticker .rq{font-size:13px}
.m.flash .bub{animation:flash 1.2s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px rgba(59,130,246,.55)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
.mo{position:fixed;inset:0;z-index:70;background:rgba(10,14,30,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px;animation:moin .16s ease-out;overflow:auto}
@keyframes moin{from{opacity:0}to{opacity:1}}
.mo-in{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin:auto}
.mo.me .mo-in{align-items:flex-end}.mo.them .mo-in{align-items:flex-start}
.mo .m{max-width:100%;margin:0;pointer-events:none;max-height:34vh;overflow:hidden;transform:none!important}
.mo .swr{display:none}
.rxbar{display:flex;gap:2px;background:var(--card);border-radius:32px;padding:6px 8px;box-shadow:0 14px 40px rgba(0,0,0,.28);animation:rxpop .2s cubic-bezier(.3,1.5,.5,1)}
.rxbar button{width:44px;height:44px;font-size:26px;border-radius:50%;transition:transform .12s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.rxbar button:hover,.rxbar button:active{transform:scale(1.25)}
.rxbar button.on{background:var(--blue)}
.mact{background:var(--card);border-radius:20px;min-width:230px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.mact button{display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;padding:14px 18px;color:var(--navy);font-size:16px;font-weight:500;border-bottom:1px solid var(--line)}
.mact button:last-child{border-bottom:0}
.mact button:active{background:var(--soft)}
.mact button.dg{color:var(--danger)}
.mact svg{width:20px;height:20px}
.rbar{display:flex;align-items:center;gap:10px;margin:0 6px 8px;padding:9px 8px 9px 14px;background:var(--soft);border-radius:18px;border-left:4px solid var(--blue)}
.rbar .rt{flex:1;min-width:0}
.rbar .rt b{display:block;font:600 13px var(--head);color:var(--blue)}
.rbar .rt span{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpon .rbar{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.fwlist{max-height:46vh;overflow-y:auto;margin:0 -8px 12px}
.fwlist .item{border-bottom:0;border-radius:14px;padding:10px 8px}

/* ===== animated emoji + effects ===== */
.ae{display:inline-block;width:var(--s);height:var(--s);object-fit:contain;vertical-align:middle;user-select:none;-webkit-user-drag:none}
.bub img.ae{border-radius:0;cursor:default;max-width:none;max-height:none}
.m.sticker .bub .ae{display:block}
/* Instagram-style emoji animations: spring pop-in, big ones breathe */
.ae{transform-origin:50% 60%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.14));image-rendering:auto}
.ae-in{animation:aeIn .55s cubic-bezier(.34,1.56,.64,1) both}
.ae-in.ae-loop{animation:aeIn .55s cubic-bezier(.34,1.56,.64,1) both,aeBreathe 2.4s ease-in-out .6s infinite}
@keyframes aeIn{0%{transform:scale(0) rotate(-25deg);opacity:0}55%{transform:scale(1.28) rotate(8deg);opacity:1}80%{transform:scale(.94) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes aeBreathe{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.07) translateY(-4%)}}
.rxbar button{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.rxbar button:active{transform:scale(1.6) translateY(-8px)}
.rxbar button:hover{transform:scale(1.25) translateY(-4px)}
@media (prefers-reduced-motion:reduce){.ae,.ae-in{animation:none}}
/* pin / archive / link preview / location / voice speed */
.row .pinm{font-size:13px;margin-left:6px;opacity:.7}
.row.arch .name{font-size:16px}
.row.arch .ico{width:76px;height:76px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:28px;flex:none}
.lpc{display:block;margin:8px -14px -8px;border-radius:18px;overflow:hidden;background:rgba(127,127,127,.14);color:inherit;text-decoration:none;white-space:normal;-webkit-user-select:none}
.lpc img{display:block;width:100%;max-height:170px;object-fit:cover}
.lpc .lpt{padding:8px 12px 10px}.lpc b{display:block;font:600 14px/1.3 var(--head);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lpc small{display:block;font-size:12px;opacity:.7;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub a.ln{color:inherit;text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.locc{position:relative;width:240px;max-width:100%;cursor:pointer;border-radius:20px;overflow:hidden;background:var(--card)}
.locc .map{position:relative;width:240px;max-width:100%;height:150px;overflow:hidden;background:#dfe6ee}
.locc .map img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}
.locc .lpin{position:absolute;left:50%;top:50%;font-size:34px;line-height:1;transform:translate(-50%,-92%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));animation:aeIn .5s cubic-bezier(.34,1.56,.64,1) both}
.locc .lcap{padding:8px 12px;font:600 13px var(--head);color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:center}
.locc .lcap small{font-weight:400;opacity:.6;font-size:10px}
.vspd{flex:none;min-width:38px;height:26px;padding:0 8px;border-radius:13px;background:rgba(127,127,127,.22);font:700 12px var(--head);color:inherit}
/* ---- calls ---- */
.cbtns{display:flex;gap:12px;margin-top:2px}
.cbtns button{width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);display:grid;place-items:center;transition:transform .15s}
.cbtns button:active{transform:scale(.88)}
.wpon .cbtns button{background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#callBanner{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;max-width:460px;margin:0 auto;z-index:130;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:30px;background:rgba(28,30,38,.88);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);color:#fff;box-shadow:0 16px 44px rgba(0,0,0,.38);animation:cbIn .55s cubic-bezier(.34,1.4,.64,1) both}
#callBanner .av{flex:none}
#callBanner .ct{flex:1;min-width:0}
#callBanner .ct b{display:block;font:600 16px var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#callBanner .ct small{display:block;opacity:.7;font-size:13px;margin-top:1px}
.cbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;transition:transform .12s}
.cbtn:active{transform:scale(.88)}
.cbtn.dec{background:#FF453A}.cbtn.dec svg{transform:rotate(135deg)}
.cbtn.acc{background:#30D158;animation:cbShake 1.6s ease-in-out infinite}
@keyframes cbIn{from{transform:translateY(-140%);opacity:0}to{transform:none;opacity:1}}
@keyframes cbOut{to{transform:translateY(-140%);opacity:0}}
@keyframes cbShake{0%,50%,100%{transform:rotate(0)}10%{transform:rotate(-16deg)}20%{transform:rotate(14deg)}30%{transform:rotate(-10deg)}40%{transform:rotate(6deg)}}
#callScr{position:fixed;inset:0;z-index:125;color:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:#0d1226;animation:cbFade .35s ease both}
@keyframes cbFade{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
#callScr .cbg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#2a3b7a 0%,#161d3d 55%,#0d1226 100%)}
#callScr .crv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;background:#000}
#callScr.vid.live .crv{opacity:1}
#callScr .clv{position:absolute;top:max(70px,calc(env(safe-area-inset-top) + 56px));right:16px;width:108px;height:148px;object-fit:cover;border-radius:18px;transform:scaleX(-1);background:#222;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:2}
#callScr.vid .clv{display:block}
#callScr .ctop{position:relative;z-index:3;width:100%;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 16px 0;font:500 13px var(--head);opacity:.85;letter-spacing:.3px}
#callScr .cmin{position:absolute;left:14px;top:max(10px,env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
#callScr .cmid{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 24px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
#callScr .cav{border-radius:50%;animation:cbPulse 2s ease-out infinite}
#callScr.live .cav{animation:none}
#callScr.vid.live .cav{display:none}
@keyframes cbPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 38px rgba(255,255,255,0)}}
#callScr .cnm{font:600 30px var(--head)}
#callScr .cst{font-size:17px;opacity:.8;font-variant-numeric:tabular-nums}
#callScr.vid.live .cmid{flex:none;position:absolute;top:max(64px,calc(env(safe-area-inset-top) + 50px));left:16px;align-items:flex-start;text-align:left;padding:0}
#callScr.vid.live .cnm{font-size:20px}#callScr.vid.live .cst{font-size:14px}
#callScr .cctl{position:relative;z-index:3;display:flex;gap:20px;justify-content:center;padding:0 20px max(34px,calc(env(safe-area-inset-bottom) + 18px));flex-wrap:wrap}
.cc{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-size:12px;min-width:64px}
.cc .cico{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;transition:transform .15s,background .2s,color .2s}
.cc:active .cico{transform:scale(.9)}
.cc .cico svg{width:28px;height:28px}
.cc.on .cico{background:#fff;color:#111}
.cc.end .cico{background:#FF453A;color:#fff}.cc.end .cico svg{transform:rotate(135deg)}
#callPill{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:124;background:#30D158;color:#fff;padding:8px 18px;border-radius:22px;font:600 14px var(--head);box-shadow:0 8px 22px rgba(0,0,0,.3);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;animation:cbIn .4s cubic-bezier(.34,1.4,.64,1) both}
/* login footer: smaller + pinned to bottom */
.solo{padding-bottom:0!important}
.from{padding:8px 0 max(14px,env(safe-area-inset-bottom))!important;gap:3px!important}
.from small{font-size:9.5px!important}
.from .nxr{width:60px!important}
.rx .ae{display:inline-block}
.rxbar button .ae{display:block;margin:auto}
.flt{position:fixed;z-index:72;pointer-events:none;animation:flt 1.3s ease-out forwards}
@keyframes flt{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.25);opacity:1}100%{transform:translateY(-130px) scale(1);opacity:0}}
.m.me .bub{transform-origin:100% 100%}.m.them .bub{transform-origin:0 100%}
.bub.bx-slam{animation:bxslam .75s cubic-bezier(.2,.9,.3,1)}
@keyframes bxslam{0%{transform:scale(2.6);opacity:0}40%{transform:scale(.9);opacity:1}55%{transform:translate(-5px,3px) scale(1.04)}70%{transform:translate(5px,-3px)}85%{transform:translate(-2px,1px)}100%{transform:none}}
.bub.bx-loud{animation:bxloud .9s ease-out}
@keyframes bxloud{0%{transform:scale(1)}12%{transform:scale(1.55)}22%{transform:scale(1.5) rotate(-2deg)}32%{transform:scale(1.55) rotate(2deg)}42%{transform:scale(1.5) rotate(-2deg)}55%{transform:scale(1.55) rotate(1deg)}100%{transform:scale(1)}}
.bub.bx-gentle{animation:bxgentle 1.6s ease-out}
@keyframes bxgentle{0%{transform:scale(.5);opacity:.35}55%{transform:scale(.7);opacity:.6}100%{transform:scale(1);opacity:1}}
.m.gstk .bub{background:none!important;padding:0}
.m.gstk .bub img.gifimg{background:none}
.fxrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid var(--line);color:var(--navy);font-weight:500}
.fxrow:last-of-type{border-bottom:0}
.fxrow .em2{font-size:26px;width:36px;text-align:center}
.fxprev{background:var(--blue);color:#fff;border-radius:22px;border-bottom-right-radius:4px;padding:10px 16px;margin:0 0 12px auto;max-width:80%;word-break:break-word;width:fit-content}

<body>
<noscript><main style="font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;line-height:1.6">
<h1>marsX – Private End-to-End Encrypted Messenger</h1>
<p>marsX is a private messaging app with end-to-end encryption. Send secure messages, photos, voice notes, GIFs and your location, and make free voice and video calls.</p>
<p>Please enable JavaScript to use marsX.</p>
</main></noscript>

<!-- AUTH -->
<div class="stage hidden" id="authStage">
  <div class="phone"><div class="solo">
    <div class="mxl big" role="img" aria-label="marsX"></div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub">Welcome to marsX. Private messages, end-to-end encrypted. Sign in with your email.</p>
    <div class="tabs" id="authTabs"><button id="tabIn" class="on">Sign in</button><button id="tabUp">Create account</button></div>
    <div id="otpStep" class="hidden">
      <p class="sub" id="otpSub" style="margin-top:0"></p>
      <div class="field"><label>6-digit code</label><input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="text-align:center;letter-spacing:10px;font-size:22px"></div>
      <div class="err" id="otpErr"></div>
      <button class="btn" id="otpGo">Verify &amp; create account</button>
      <div style="display:flex;justify-content:space-between;margin-top:14px">
        <button class="link" id="otpBack">Change email</button>
        <button class="link" id="otpResend" disabled>Resend code</button>
      </div>
    </div>
    <div id="formStep">
    <div class="field"><label>Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="aPass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
    <div class="field hidden" id="aPass2w"><label>Confirm password</label><input id="aPass2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
    <div class="err" id="aErr"></div>
    <button class="btn" id="aGo">Sign in</button>
    <div style="text-align:center;margin-top:14px"><button class="link" id="aForgot">Forgot password?</button></div>
    <div id="qrOpt"><div class="or">or</div><button class="btn line" id="qrBtn">Log in with QR code</button></div>
    </div>
    <div class="from"><small>from</small><div class="nxr" role="img" aria-label="Nexor"></div></div>
  </div></div>
</div>

<!-- PROFILE SETUP -->
<div class="stage hidden" id="setupStage">
  <div class="phone"><div class="solo">
    <h1 id="suTitle">Set up your profile</h1>
    <p class="sub" id="suSub">Add a name and photo. You'll get a unique UID number that friends can use to find you.</p>

(function(){
  const vv=window.visualViewport, root=document.documentElement; let maxH=window.innerHeight;
  if(!vv) return;
  let lastH=-1, lastT=-1, lastKb=null, lastW=window.innerWidth, settle=0;
  function apply(){
    if(window.innerWidth!==lastW){ lastW=window.innerWidth; maxH=window.innerHeight; }
    maxH=Math.max(maxH,window.innerHeight);
    const h=Math.round(vv.height); let t=Math.round(vv.offsetTop); if(t<0) t=0;
    const kb=(maxH-vv.height)>120;
    const hCh=Math.abs(h-lastH)>1, tCh=Math.abs(t-lastT)>1||Math.abs((vv.offsetLeft||0)-(window.__l||0))>1; window.__l=vv.offsetLeft||0;
    if(!hCh&&!tCh&&kb===lastKb) return;
    const m=document.getElementById('msgs');
    // measure BEFORE the resize so we know if the user was reading the bottom
    const wasNear=!!m&&(m.scrollHeight-m.scrollTop-m.clientHeight<220);
    if(hCh) root.style.setProperty('--vvh',h+'px');
    if(tCh) root.style.setProperty('--vvt',t+'px');
    root.style.setProperty('--vvl',Math.round(vv.offsetLeft||0)+'px');
    if(kb!==lastKb) document.body.classList.toggle('kb',kb);
    lastH=h; lastT=t; lastKb=kb;
    if(hCh&&m&&wasNear) m.scrollTop=m.scrollHeight;
  }
  function burst(){            // keyboard animation: keep syncing every frame for ~450ms
    apply(); cancelAnimationFrame(settle); const t0=performance.now();
    (function loop(){ apply(); if(performance.now()-t0<450) settle=requestAnimationFrame(loop); })();
  }
  vv.addEventListener('resize',burst); vv.addEventListener('scroll',apply);
  window.addEventListener('orientationchange',()=>setTimeout(()=>{ maxH=window.innerHeight; lastH=-1; burst(); },350));
  window.addEventListener('pageshow',burst);
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>{ if(e.touches.length>1||(e.scale&&e.scale!==1)) e.preventDefault(); },{passive:false});
  let lt=0; document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lt<350&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.preventDefault(); lt=n; },{passive:false});

  function pin(){ if(window.scrollX||window.scrollY) window.scrollTo(0,0); if(document.scrollingElement&&document.scrollingElement.scrollTop) document.scrollingElement.scrollTop=0; }
  window.addEventListener('scroll',pin,{passive:true});
  vv.addEventListener('resize',()=>{ pin(); burst(); });
  vv.addEventListener('scroll',pin);
  document.addEventListener('focusin',()=>{ pin(); [0,60,150,300,500].forEach(t=>setTimeout(pin,t)); });
  document.addEventListener('focusout',()=>setTimeout(pin,120));
  // iPhone home-screen app: iOS pans the visual viewport AFTER the keyboard opens and fires events late.
  // So while any field is focused, sync EVERY frame (same-frame follow = no visible shift).
  let live=0;
  function liveLoop(){ apply(); pin(); const a=document.activeElement; if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)) live=requestAnimationFrame(liveLoop); else { live=0; burst(); } }

  document.addEventListener('touchmove',e=>{ if(document.body.classList.contains('kb')&&e.target.closest&&e.target.closest('.chead,.composer,.nav,.panel-top')) e.preventDefault(); },{passive:false});

})();

/* =====================================================================
   E2EE  — per-device ECDH P-256 keys, per-message AES-GCM key,

const ECDH = {name:'ECDH', namedCurve:'P-256'};
function idb(){
  return new Promise((ok,no)=>{ const r=indexedDB.open('msgr-e2ee',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); });
}

async function idbSet(k,v){ const d=await idb(); return new Promise((ok,no)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>ok(); t.onerror=()=>no(t.error); }); }

async function loadOrCreateDevice(uid){
  let d = await idbGet('dev:'+uid);
  if(!d){
    const kp = await crypto.subtle.generateKey(ECDH, false, ['deriveKey']);       // private key: non-extractable
    const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
    d = { id: hex(rand(6)), priv: kp.privateKey, pub: JSON.stringify(pub) };
    await idbSet('dev:'+uid, d);
  }
  return d;
}
async function importPub(jwkStr){ return crypto.subtle.importKey('jwk', JSON.parse(jwkStr), ECDH, false, []); }
async function wrapKeyFor(myPriv, theirPubStr){
  let m = wrapCache.get(myPriv); if(!m){ m = new Map(); wrapCache.set(myPriv, m); }
  let p = m.get(theirPubStr);
  if(!p){
    p = importPub(theirPubStr).then(pub=>crypto.subtle.deriveKey({name:'ECDH', public:pub}, myPriv, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']));
    m.set(theirPubStr, p); p.catch(()=>m.delete(theirPubStr));
  }
  return p;
}
// bytes -> {iv, ct, keys:{deviceId:{i,c}}}
async function e2eeEncrypt(bytes, myPriv, targets /* {devId: pubJwkString} */, mediaBytes){
  const mk = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt']);
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, mk, bytes);
  const raw = await crypto.subtle.exportKey('raw', mk);
  const keys = {};
  await Promise.all(Object.entries(targets).map(async ([id,pub])=>{
    try{
      const sk = await wrapKeyFor(myPriv, pub), wiv = rand(12);
      keys[id] = { i:b64(wiv), c:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv:wiv}, sk, raw)) };
    }catch(e){ console.warn('skip device', id, e); }
  }));
  let media = null;
  if(mediaBytes){ const miv = rand(12); media = { iv:b64(miv), ct:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv:miv}, mk, mediaBytes)) }; }
  return { iv:b64(iv), ct:b64(ct), keys, media };
}
async function e2eeUnwrap(rec, myDevId, myPriv, senderPubStr){
  const w = rec.k && rec.k[myDevId]; if(!w) return null;
  const sk = await wrapKeyFor(myPriv, senderPubStr);
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(w.i)}, sk, unb64(w.c));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']);
}

async function e2eeDecryptMedia(m, mk){ return crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(m.iv)}, mk, unb64(m.ct)); }

function resizeImage(fileOrBlob, max, q, square){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(fileOrBlob), img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'), ctx=c.getContext('2d');
      if(square){
        const side=Math.min(img.width,img.height), sx=(img.width-side)/2, sy=(img.height-side)/2, out=Math.min(max,side);
        c.width=c.height=out; ctx.drawImage(img,sx,sy,side,side,0,0,out,out);
      } else {
        const s=Math.min(1,max/Math.max(img.width,img.height)); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); ctx.drawImage(img,0,0,c.width,c.height);
      }
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); no(new Error('Bad image')); }; img.src=url;
  });
}

}

/* ---------------- messages: receive ---------------- */
async function senderPub(uid, devId){
  const k = uid+'/'+devId; if(pubCache.has(k)) return pubCache.get(k);
  const dc = devCache[uid]; if(dc && dc[devId]){ pubCache.set(k, dc[devId]); return dc[devId]; }
  const s = await R(`devices/${uid}/${devId}/pub`).once('value'); const v=s.val(); if(v) pubCache.set(k,v); return v;
}
async function onMsg(uid, key, rec){
  const t = threads[uid]; if(!t || t.items.some(i=>i.key===key) || (t.seen&&t.seen.has(key))) return;
  t.votes = t.votes||{};
  const item = { key, from:rec.from, ts:rec.ts||Date.now(), rec, p:null, mk:null, locked:false };
  if(item.ts<=clrTs(chatCid(uid))) return;     // chat was cleared on this device
  if(rec.from!==me.uid && blockedAt[rec.from] && item.ts>blockedAt[rec.from]) return;   // blocked: never shown
  try{
    const spub = await senderPub(rec.from, rec.fd);
    let mk=null; try{ mk = spub ? await e2eeUnwrap(rec, dev.id, dev.priv, spub) : null; }catch(_){}
    if(!mk) mk = await histUnwrap(chatCid(uid), key);
    if(!mk) item.locked = true;
    else { item.mk = mk; item.p = JSON.parse(dec.decode(await e2eeDecryptBody(rec, mk))); }
  }catch(e){ item.locked = true; }
  if(item.p && item.p.t==='vote'){            // poll votes are hidden messages
    (t.seen=t.seen||new Set()).add(key); (t.hid=t.hid||[]).push(item); if(t.hid.length>500) t.hid.shift();
    const v=(t.votes[item.p.ref]=t.votes[item.p.ref]||{}), cur=v[rec.from];
    if(!cur || item.ts>=cur.ts) v[rec.from]={ ts:item.ts, sel:(Array.isArray(item.p.sel)?item.p.sel:[]).filter(n=>Number.isInteger(n)).slice(0,10) };
    const fn=pollEls.get(item.p.ref); if(fn) fn();
    return;
  }
  if(item.p && item.p.t==='call'){             // call signaling = hidden messages
    (t.seen=t.seen||new Set()).add(key); try{ handleCallSignal(uid,item); }catch(e){ console.warn(e); }
    return;
  }
  if(item.p && item.p.t==='react'){            // reactions are hidden messages
    (t.seen=t.seen||new Set()).add(key); (t.hid=t.hid||[]).push(item); if(t.hid.length>500) t.hid.shift();
    const r=(t.reacts=t.reacts||{}), m=(r[item.p.ref]=r[item.p.ref]||{}), cur=m[rec.from], e=(typeof item.p.e==='string'&&item.p.e.length<=8)?item.p.e:null;
    const isNew=!!e&&(!cur||cur.e!==e)&&(!cur||item.ts>=cur.ts)&&(Date.now()-item.ts<6000);
    if(!cur || item.ts>=cur.ts) m[rec.from]={ ts:item.ts, e };
    paintReacts(uid,item.p.ref); if(isNew&&openUid===uid) floatReact(item.p.ref,e);
    return;
  }
  if(item.p && item.p.t==='unsend'){           // delete for everyone (only the original sender may do it)
    (t.seen=t.seen||new Set()).add(key); (t.hid=t.hid||[]).push(item); if(t.hid.length>500) t.hid.shift();
    const tg=t.items.find(i=>i.key===item.p.ref);
    if(tg){ if(tg.from===rec.from) applyUnsend(uid,tg); }
    else (t.unsent=t.unsent||new Map()).set(String(item.p.ref),rec.from);
    return;
  }
  if(isDeletedLocal(uid,key)) return;          // "delete for you"
  if(t.unsent && t.unsent.get(key)===rec.from){ item.unsent=true; item.p={t:'unsent'}; item.mk=null; item.locked=false; }
  t.items.push(item); t.items.sort((a,b)=>a.ts-b.ts || (a.key<b.key?-1:1));
  if(rec.from!==me.uid) markDelivered(uid);
  t.last = t.items[t.items.length-1];
  const lr = getLR(uid);
  t.unread = t.items.filter(i=>i.from!==me.uid && i.ts>lr).length;
  if(openUid===uid){
    if(document.visibilityState==='visible'){ setLR(uid, Math.max(Date.now(), item.ts)); t.unread=0; }
    appendMsg(item);
    if(rec.from!==me.uid) markRead(uid);
  }
  renderList();
}
function previewOf(it,key){
  if(!it) return key&&isGroup(key) ? 'New group' : 'Say hello 👋';
  if(it.locked) return '🔒 Encrypted message';
  if(it.unsent) return (it.from===me.uid?'You: ':'')+'unsent a message';
  const p=it.p; if(!p) return '🔒 Encrypted message';
  const T=v=>(v==null||v==='null'||v==='undefined')?'':String(v);
  if(p.t==='sys') return T(p.text);
  if(p.t==='calllog') return callLogText(it);
  const who = it.from===me.uid ? 'You: ' : (key&&isGroup(key) ? firstName(it.from)+': ' : '');
  if(p.t==='poll') return who+'📊 '+p.q;
  if(p.t==='img') return who+'📷 Photo';
  if(p.t==='gif') return who+'GIF';
  if(p.t==='voice') return who+'🎤 Voice message';
  if(p.t==='loc') return who+'📍 Location';
  return who+(T(p.text)||'Message');
}

  const s = await R('devices/'+u).once('value'); const v=s.val()||{}, o={};
  for(const [id,d] of Object.entries(v)){ o[id]=d.pub; pubCache.set(u+'/'+id,d.pub); }

function dropGroup(gid,notify){
  if(groupWatch[gid]) groupWatch[gid]();
  const name=contacts[gid]&&contacts[gid].name;

  if(openUid===gid) closeChat();
  if(notify&&name) toast('You’re no longer in '+name);

function syncGroups(gids){
  gids.forEach(gid=>{
    if(groupWatch[gid]) return;
    threads[gid]=threads[gid]||{items:[],last:null,unread:0,chain:Promise.resolve(),votes:{}};
    const gr=R('groups/'+gid);
    const gf=gr.on('value',s=>{
      const v=s.val();
      if(!v||!v.members||!v.members[me.uid]){ dropGroup(gid,!!v); return; }
      contacts[gid]={uid:gid,isGroup:true,uidNum:'',about:'',name:v.name||'Group',photo:v.photo||null,members:v.members,by:v.by,created:v.created};
      Object.keys(v.members).forEach(loadProfile);
      renderAll(); if(ciOpen===gid) openGroupInfo(gid);
    },()=>dropGroup(gid,true));
    const mr=R('chats/'+gid+'/messages').limitToLast(150);
    const mf=mr.on('child_added',s=>{ const t=threads[gid]; if(!t) return; t.chain=t.chain.then(()=>onMsg(gid,s.key,s.val())).catch(e=>console.warn(e)); });
    groupWatch[gid]=()=>{ gr.off('value',gf); mr.off('child_added',mf); delete groupWatch[gid]; };
  });
  Object.keys(groupWatch).forEach(g=>{ if(!gids.includes(g)) dropGroup(g,true); });
}

const WP=[
  {n:'Sand',c:'#F1E8D8'},{n:'Sage',c:'#DCEADB'},{n:'Blush',c:'#F6E0E5'},{n:'Lavender',c:'#E4DFF5'},
  {n:'Sky',c:'linear-gradient(160deg,#a1c4fd,#c2e9fb)'},{n:'Aurora',c:'linear-gradient(160deg,#84fab0,#8fd3f4)'},
  {n:'Dusk',c:'linear-gradient(160deg,#a18cd1,#fbc2eb)'},{n:'Sunset',c:'linear-gradient(160deg,#ffd6a5,#ffadad)'},
  {n:'Slate',c:'#1B2033'},{n:'Midnight',c:'linear-gradient(160deg,#1f2a5a,#0f1530)'}
];
function wpRead(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(_){ return null; } }
let wpShared={};   // cid -> wallpaper set for that chat (synced, both people see it)
const WP_IMG=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
function wpOk(o){   // never trust wallpaper data that came from another user
  if(!o||typeof o!=='object') return null;
  if(o.t==='none') return o;
  if(o.t==='c' && WP.some(p=>p.c===o.c)) return o;
  if(o.t==='img' && typeof o.d==='string' && o.d.length<400000 && WP_IMG.test(o.d)) return o;
  return null;

function animEmoji(e,size){
  const txt=()=>h('span',{style:`font-size:${Math.round(size*.82)}px;line-height:1;display:inline-block`},e);
  if(!PREF.get('fx')) return txt();
  // Apple/iOS-style emoji art (same look Instagram shows on iPhone) + Instagram-style spring animations
  const cp=Array.from(e).map(c=>c.codePointAt(0).toString(16).padStart(4,'0')), full=cp.join('-'), strip=cp.filter(x=>x!=='fe0f').join('-');
  const urls=[full]; if(strip!==full) urls.push(strip);
  const A=c=>'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/'+c+'.png';
  const T=c=>'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/'+c.replace(/-fe0f/g,'')+'.svg';
  const srcs=[...urls.map(A),T(full)];
  const big=size>=60;
  let i=0; const im=h('img',{class:'ae ae-in'+(big?' ae-loop':''),alt:e,draggable:'false',loading:'lazy',referrerpolicy:'no-referrer',style:'--s:'+size+'px'});
  im.onerror=()=>{ i++; if(i<srcs.length) im.src=srcs[i]; else if(im.parentNode) im.replaceWith(txt()); };
  im.src=srcs[0]; return im;
}

/* =====================================================================
   Multi-device history sync (still end-to-end encrypted)
   An existing device — after the owner taps "Allow" — re-wraps the message
   key of each message for the NEW device's public key and stores only that
   wrapped key under histKeys/<uid>/<newDevId>. The server never sees plaintext
   or raw keys; only the new device's private key can open them.
   ===================================================================== */
let histMap={}, hsAsked=new Set(), hsTimer=null, hrT=null, hsBusy=false;
const hsMem={};   // fallback when localStorage is blocked (private mode / in-app browsers)
const hsFlag=(k,id)=>{ const key='hs'+k+':'+me.uid+':'+id; if(hsMem[key]) return true; try{ return localStorage.getItem(key)==='1'; }catch(_){ return false; } };
const hsSet=(k,id)=>{ const key='hs'+k+':'+me.uid+':'+id; hsMem[key]=1; try{ localStorage.setItem(key,'1'); }catch(_){} };
// "Later" / dismissed -> don't ask again for 3 days (survives reloads)
const HS_SNOOZE=3*24*3600*1000;
const hsSnoozed=id=>{ const key='hslater:'+me.uid+':'+id; let t=hsMem[key]||0; try{ t=Math.max(t,+localStorage.getItem(key)||0); }catch(_){} return Date.now()-t<HS_SNOOZE; };
const hsSnooze=id=>{ const key='hslater:'+me.uid+':'+id, t=Date.now(); hsMem[key]=t; try{ localStorage.setItem(key,String(t)); }catch(_){} };
async function histUnwrap(cid,key){
  const w=(histMap[cid]||{})[key]; if(!w||!dev) return null;
  try{
    const pub=await senderPub(me.uid,w.fd); if(!pub) return null;
    const sk=await wrapKeyFor(dev.priv,pub);
    const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.i)},sk,unb64(w.c));
    return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['decrypt']);
  }catch(_){ return null; }
}
async function reprocessHist(){
  let touched=false;
  for(const [uid,t] of Object.entries(threads)){
    const hm=histMap[chatCid(uid)]; if(!hm) continue;
    const redo=t.items.filter(i=>i.locked&&hm[i.key]); if(!redo.length) continue;
    t.items=t.items.filter(i=>!redo.includes(i));
    for(const i of redo){ try{ await onMsg(uid,i.key,i.rec); }catch(e){ console.warn(e); } }
    t.last=t.items[t.items.length-1]||null; touched=true;
    if(openUid===uid) renderChat();
  }
  if(touched){ renderList(); toast('Older messages synced from your other device'); }
}
const hsItems=t=>[...t.items,...(t.hid||[])];
function hsNeeds(did){
  let n=0; for(const t of Object.values(threads)) for(const it of hsItems(t)) if(it.mk&&!it.locked&&!it.unsent&&it.rec&&it.rec.k&&!it.rec.k[did]) n++;
  return n;
}
async function syncHistory(){
  if(!me||!dev||hsBusy) return; hsBusy=true;
  try{
    const others=Object.entries(devCache[me.uid]||{}).filter(([id])=>id!==dev.id&&hsFlag('ok',id));
    for(const [did,pub] of others){
      const dk='hsdone:'+me.uid+':'+did; let done; try{ done=new Set(JSON.parse(localStorage.getItem(dk)||'[]')); }catch(_){ done=new Set(); }
      const upd={}, added=[];
      for(const [uid,t] of Object.entries(threads)){
        const cid=chatCid(uid);
        for(const it of hsItems(t)){
          if(!it.mk||it.locked||it.unsent||!it.rec||(it.rec.k&&it.rec.k[did])||done.has(it.key)) continue;
          try{
            const raw=await crypto.subtle.exportKey('raw',it.mk), sk=await wrapKeyFor(dev.priv,pub), iv=rand(12);

            added.push(it.key);
          }catch(_){}
        }
      }
      const ents=Object.entries(upd); if(!ents.length) continue;
      try{
        for(let i=0;i<ents.length;i+=200) await R('').update(Object.fromEntries(ents.slice(i,i+200)));
        added.forEach(k=>done.add(k)); try{ localStorage.setItem(dk,JSON.stringify([...done].slice(-6000))); }catch(_){}
      }catch(e){ console.warn('history sync failed',e); toast('History sync is blocked by Firebase rules (see setup note)'); break; }
    }
  } finally { hsBusy=false; }
}
async function checkNewDevices(){
  if(!me||!dev||document.querySelector('#modalRoot .modal')||(typeof call!=='undefined'&&call)) return;
  let v; try{ v=(await R('devices/'+me.uid).once('value')).val()||{}; }catch(_){ return; }
  for(const [id,d] of Object.entries(v)){
    if(id===dev.id||hsFlag('ok',id)||hsFlag('no',id)||hsSnoozed(id)||hsAsked.has(id)) continue;
    if(!hsNeeds(id)) continue;

    modal(h('div',{class:'sheet'},h('h2',{},'Share chat history?'),

function linkify(text){
  const out=[]; let last=0; const re=/https?:\/\/[^\s<>"']+/gi; let m;
  while((m=re.exec(String(text)))){
    let raw=m[0], trail=''; const t=raw.match(/[).,!?;:]+$/); if(t){ trail=t[0]; raw=raw.slice(0,-trail.length); }
    const href=safeHttp(raw); if(!href) continue;
    if(m.index>last) out.push(String(text).slice(last,m.index));
    out.push(h('a',{class:'ln',href,target:'_blank',rel:'noopener noreferrer'},raw)); if(trail) out.push(trail);
    last=m.index+m[0].length;
  }
  if(last<String(text).length) out.push(String(text).slice(last)); return out;
}
function lpCard(lp){
  if(!lp||typeof lp!=='object') return null; const href=safeHttp(String(lp.u||'')); if(!href) return null;
  const a=h('a',{class:'lpc',href,target:'_blank',rel:'noopener noreferrer'});
  if(typeof lp.i==='string'&&/^https:\/\//i.test(lp.i)){ const im=h('img',{src:lp.i,alt:'',loading:'lazy',referrerpolicy:'no-referrer'}); im.onerror=()=>im.remove(); a.append(im); }
  a.append(h('div',{class:'lpt'},h('b',{},String(lp.t||href).slice(0,120)),h('small',{},String(lp.s||'').slice(0,60)))); return a;
}

function locView(p){
  const lat=Number(p.lat), lng=Number(p.lng); if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return h('div',{style:'padding:10px 14px'},'📍 Location unavailable');
  const z=15, n=Math.pow(2,z), W=240, H=150, rad=lat*Math.PI/180;
  const px=(lng+180)/360*n*256, py=(1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n*256, left=px-W/2, top=py-H/2;
  const map=h('div',{class:'map'});
  for(let tx=Math.floor(left/256);tx<=Math.floor((left+W)/256);tx++) for(let ty=Math.floor(top/256);ty<=Math.floor((top+H)/256);ty++){
    if(ty<0||ty>=n) continue; const wx=((tx%n)+n)%n;
    map.append(h('img',{src:'https://tile.openstreetmap.org/'+z+'/'+wx+'/'+ty+'.png',alt:'',loading:'lazy',draggable:'false',style:'left:'+Math.round(tx*256-left)+'px;top:'+Math.round(ty*256-top)+'px'}));
  }
  map.append(h('div',{class:'lpin'},'📍'));
  const card=h('div',{class:'locc',role:'link',onclick:e=>{ e.stopPropagation(); window.open('https://www.google.com/maps/search/?api=1&query='+lat+','+lng,'_blank','noopener'); }},map,h('div',{class:'lcap'},h('span',{},'📍 Shared location'),h('small',{},'© OpenStreetMap')));
  return card;
}

async function submitReport(uid, reason, details, withEvidence, alsoBlock){
  const day = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const rid = me.uid+'_'+uid+'_'+day;                       // one report per person per day
  const ev = [];
  if(withEvidence){
    (threads[uid]?.items||[]).filter(i=>!i.locked && i.p).slice(-10).forEach(i=>{
      const p=i.p;
      ev.push({ who:i.from===me.uid?'reporter':'reported', t:String(p.t||'text').slice(0,10),
        text: p.t==='text' ? String(p.text).slice(0,500) : (p.t==='img' ? '[photo]' : p.t==='gif' ? '[gif]' : '[voice message]'), ts:i.ts });
    });
  }
  const rec = { by:me.uid, against:uid, cid:cidOf(me.uid,uid), reason, ts:TS, status:'open' };
  if(details) rec.details = details.slice(0,600);
  if(ev.length) rec.evidence = ev;
  await R('reports/'+rid).set(rec);
  if(alsoBlock){ try{ await R('blocks/'+me.uid+'/'+uid).set(TS); }catch(e){} }
}

    h('p',{},'Reports go to our moderators. The person you report won’t be told.'),
    h('div',{},opts), h('div',{class:'field',style:'margin-top:12px'},det),
    h('label',{class:'chk'},evC,h('span',{},'Include the last 10 messages from this chat so moderators can review them. Only these messages are shared; the rest stay private.')),
    h('label',{class:'chk'},blkC,h('span',{},'Also block this contact')),
    err, go, h('button',{class:'btn ghost',style:'margin-top:10px',onclick:closeModal},'Cancel')));
}

/* ----- what a restricted user sees ----- */
function applyMod(m){
  myMod=m; clearTimeout(modTimer); const now=Date.now();
  const active = !!m && (m.status==='banned' || (m.status==='suspended' && (m.until||0)>now));
  const old=document.getElementById('modOverlay'); if(old) old.remove();
  if(active){
    document.body.append(h('div',{id:'modOverlay'}, h('div',{class:'sheet',style:'text-align:center'},
      h('div',{style:'color:var(--danger);margin-bottom:8px'},svg('lock')),
      h('h2',{}, m.status==='banned' ? 'Account banned' : 'Account suspended'),
      h('p',{}, m.status==='banned' ? 'Your account was banned for breaking our rules.' : 'Your account is suspended until '+new Date(m.until).toLocaleString()+'.'),
      m.reason ? h('p',{},'Reason: '+m.reason) : null,
      h('button',{class:'btn',onclick:()=>auth.signOut()},'Log out'))));
    if(m.status==='suspended') modTimer=setTimeout(()=>applyMod(myMod), Math.min(m.until-now+500, 2147483000));
  } else if(m && m.status==='warned' && !m.ack){
    closeModal();
    modal(h('div',{class:'sheet'}, h('h2',{},'Warning from moderators'),
      h('p',{}, m.reason || 'Your account was reported for breaking our rules. Please follow the community guidelines.'),
      h('button',{class:'btn',onclick:async()=>{ try{ await R('moderation/'+me.uid+'/ack').set(true); }catch(e){} closeModal(); }},'I understand')));
  }
}

/* ----- moderator panel (only people listed under admins/ can open it) ----- */
async function modAct(against, ids, action, note){
  const now=Date.now(), upd={};
  if(action!=='dismiss'){
    const m={ status: action==='warn'?'warned' : action==='ban'?'banned' : 'suspended', reason:note||'', by:me.uid, ts:TS };
    if(action==='suspend1') m.until=now+864e5;
    if(action==='suspend7') m.until=now+7*864e5;
    upd['moderation/'+against]=m;
  }
  ids.forEach(id=>{
    upd['reports/'+id+'/status']= action==='dismiss' ? 'dismissed' : 'resolved';
    upd['reports/'+id+'/action']=action; upd['reports/'+id+'/resolvedBy']=me.uid; upd['reports/'+id+'/resolvedAt']=TS;
  });
  upd['modLog/'+R('modLog').push().key]={ by:me.uid, against, action, note:note||'', ts:TS, reports:ids.length };
  await R('').update(upd);
}
function openModPanel(){
  if(!isAdmin) return;
  const sheet=h('div',{class:'sheet modsheet'}); closeModal(); modal(sheet);
  let view='open';
  const tabsEl=()=>h('div',{class:'tabs'}, ['open','restricted'].map(v=>h('button',{class:view===v?'on':'',onclick:()=>{ view=v; render(); }}, v==='open'?'Open reports':'Restricted users')));

  async function reportEl(r){
    const who=await nameOf(r.by), ev=r.evidence?Object.values(r.evidence):[];
    const evBox=h('div',{class:'evbox hidden'}, h('div',{class:'evnote'},'Provided by the reporter. Chats are end-to-end encrypted, so this can’t be independently verified.'),
      ev.map(e=>h('div',{class:'ev '+e.who}, h('b',{}, e.who==='reported'?'Reported: ':'Reporter: '), e.text)));
    return h('div',{class:'rep'}, h('div',{class:'rtop'}, h('b',{},r.reason), h('span',{class:'time'}, relTime(r.ts))),
      h('div',{class:'rby'},'by '+who), r.details?h('div',{class:'rdet'},r.details):null,
      ev.length?h('button',{class:'link',onclick:()=>evBox.classList.toggle('hidden')},'Messages ('+ev.length+')'):null, evBox);
  }
  function actionRow(against, rs){
    const ids=rs.map(r=>r.id), top=rs[0].reason, row=h('div',{});
    const act=(label,action,ask)=>h('button',{class:'btn line mini',onclick:async()=>{
      let note='';
      if(ask){ const n=prompt('Reason shown to the user:', top); if(n===null) return; note=n; }
      else if(!confirm(label+'?')) return;
      try{ await modAct(against,ids,action,note); toast('Done'); render(); }catch(e){ toast('Failed: '+(e.message||e)); }
    }}, label);
    row.append(act('Dismiss','dismiss',false), act('Warn','warn',true), act('Suspend 24h','suspend1',true), act('Suspend 7d','suspend7',true), act('Ban','ban',true));
    return row;
  }
  async function openView(){
    const s=await R('reports').orderByChild('status').equalTo('open').limitToFirst(100).once('value'); const groups={};
    s.forEach(c=>{ const r={id:c.key,...c.val()}; (groups[r.against]=groups[r.against]||[]).push(r); });
    const ids=Object.keys(groups);
    if(!ids.length) return h('div',{class:'empty'}, h('b',{},'All clear'), 'No open reports.');
    ids.sort((a,b)=>groups[b].length-groups[a].length);
    const wrap=h('div',{});
    for(const against of ids){
      const rs=groups[against].sort((a,b)=>(b.ts||0)-(a.ts||0));
      const card=h('div',{class:'modcard'}, h('div',{class:'mh'}, h('b',{}, await nameOf(against)), h('span',{class:'badge'}, rs.length)));
      for(const r of rs) card.append(await reportEl(r));
      card.append(actionRow(against,rs)); wrap.append(card);
    }
    return wrap;
  }
  async function restrictedView(){
    const v=(await R('moderation').once('value')).val()||{}, ids=Object.keys(v);
    if(!ids.length) return h('div',{class:'empty'}, h('b',{},'Nobody restricted'), 'Warned, suspended and banned users show up here.');
    const wrap=h('div',{});
    for(const uid of ids){
      const m=v[uid], name=await nameOf(uid);
      wrap.append(h('div',{class:'modcard'}, h('div',{class:'mh'}, h('b',{},name), h('span',{class:'time'}, m.status+(m.until?' until '+new Date(m.until).toLocaleString():''))),
        m.reason?h('div',{class:'rdet'},m.reason):null,
        h('button',{class:'btn line mini',onclick:async()=>{ if(!confirm('Lift the restriction on '+name+'?')) return;
          try{ await R('').update({['moderation/'+uid]:null, ['modLog/'+R('modLog').push().key]:{by:me.uid,against:uid,action:'lift',note:'',ts:TS}}); render(); }catch(e){ toast('Failed: '+(e.message||e)); } }},'Lift')));
    }
    return wrap;
  }
  async function render(){
    sheet.innerHTML=''; sheet.append(h('h2',{},'Moderation'), tabsEl(), h('div',{class:'empty'},'Loading…'));
    try{ const body = view==='open' ? await openView() : await restrictedView(); sheet.children[2].replaceWith(body); }
    catch(e){ sheet.children[2].replaceWith(h('div',{class:'err'},'Could not load: '+(e.message||e))); }
    sheet.append(h('button',{class:'btn ghost',style:'margin-top:14px',onclick:closeModal},'Close'));
  }
  render();
}

document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&openUid&&threads[openUid]){ threads[openUid].unread=0; setLR(openUid,Date.now()); renderList(); markRead(openUid); } });
if(!firebaseConfig.apiKey) document.body.textContent='Missing Firebase config';
</script>
